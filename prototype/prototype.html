const KEY='shixu-creator-prototype-v2',$=s=>activeDialog()?.querySelector(s)||document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TOOLS={manual:'手动',claude_code:'Claude Code',workbuddy:'WorkBuddy',codex:'Codex',deepseek_harness:'DeepSeek Harness',unknown:'未知来源'};

function persistProfiles(){try{localStorage.setItem(KEY+'-profiles',JSON.stringify({items:profiles,active:activeProfileId}));return true}catch{toast('记录身份尚未保存，刷新后请重新设置');return false}}
function identitySwitch(cls){return `<button class="identity-switch ${cls} identity-button" data-event-id="EVT-ACTION" data-action="identity-settings" aria-label="记录身份"><span>记录身份</span><strong>${esc(currentProfile().name)}</strong><span aria-hidden="true">⌄</span></button>`}

function creationFields(obj){if(obj)return creationDetail(obj);const c=currentProfile(),human=profiles.filter(x=>x.kind==='person'),via=c.kind==='person'?'manual':c.via;return `<details class="creation-config"><summary>创建信息 · ${esc(c.name)}${c.kind==='agent'?' · '+esc(c.modelName||'模型未提供'):''}</summary><div class="grid2">${field('人类发起者 · 选填',`<select name="creationPerson" data-event-id="EVT-CREATION">${human.map(x=>`<option value="${esc(x.id)}" ${c.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="ai" ${c.kind==='agent'?'selected':''} ${via==='manual'?'disabled':''}>未指定人类发起者</option></select>`)}${field('创建来源',`<select name="creationVia" data-event-id="EVT-CREATION">${Object.entries(TOOLS).filter(([id])=>id!=='unknown').map(([id,name])=>`<option value="${id}" ${via===id?'selected':''} ${id==='manual'&&!human.length?'disabled':''}>${name}</option>`).join('')}</select>`)}</div><div class="grid2 model-fields ${via==='manual'?'hidden':''}">${field('模型名称 / ID · 选填',`<input name="modelName" data-event-id="EVT-FIELD" maxlength="160" value="${esc(c.kind==='agent'?c.modelName||'':'')}" placeholder="填写工具实际返回的模型标识">`)}${field('模型提供方 · 选填',`<input name="modelProvider" data-event-id="EVT-FIELD" maxlength="80" value="${esc(c.kind==='agent'?c.modelProvider||'':'')}" placeholder="例如 OpenAI、Anthropic、DeepSeek">`)}</div><p>自动带入当前记录身份；需要代录时可指定人类发起者。</p></details>`}
function creationValues(v){const c=currentProfile(),via=v.creationVia||(c.kind==='person'?'manual':c.via),person=v.creationPerson||(c.kind==='person'?c.id:'ai'),human=profiles.find(x=>x.id===person&&x.kind==='person'),actor=via==='manual'?person:c.kind==='agent'&&c.via===via?c.id:'agent:'+via;return {initiatedByPersonId:human?.id||null,createdByActorId:actor,creatorName:human?.name||(actor===c.id?c.name:TOOLS[via]),createdVia:via,createdAt:new Date().toISOString(),modelInfo:via==='manual'?null:{name:String(v.modelName??(c.kind==='agent'&&c.via===via?c.modelName:'')??'').trim(),provider:String(v.modelProvider??(c.kind==='agent'&&c.via===via?c.modelProvider:'')??'').trim()}}}

document.addEventListener('change',e=>{const el=e.target;if(el.name==='profileKind')el.closest('form').querySelector('.profile-ai-fields').classList.toggle('hidden',el.value!=='agent');if(el.dataset.eventId==='EVT-CREATOR-FILTER'){creatorFilters[el.dataset.kind][el.dataset.filter]=el.value;render()}if(el.dataset.eventId==='EVT-CREATION'){const f=el.closest('form'),via=f.elements.creationVia.value,person=f.elements.creationPerson;f.querySelector('.model-fields').classList.toggle('hidden',via==='manual');person.querySelector('[value="ai"]').disabled=via==='manual';if(via==='manual'&&person.value==='ai')person.value=profiles.find(x=>x.kind==='person')?.id||'';f.querySelector('summary').textContent='创建信息 · '+(profiles.find(x=>x.id===person.value)?.name||TOOLS[via])}}

const seed={version:1,issues:[{id:'p1',title:'每天整理报表，都在重复复制粘贴',description:'每个工作日要在三个表格之间搬数据，大约花掉40分钟。希望先找出最重复的步骤，尝试把它自动化。',priority:'高',tag:'工作效率',status:'处理中',resolution:'',logs:['记录问题：重复操作影响了专注时间。']},{id:'p2',title:'临时想法散落各处，回头总找不到',description:'微信收藏、便签和笔记里都有想法，需要的时候记不起放在哪里。',priority:'中',tag:'个人管理',status:'待处理',nextStep:'统一收集散落想法',successCriteria:'需要时能在一个入口找到',resolution:'',logs:['已梳理：统一收集入口。']},{id:'p3',title:'会议结束后，下一步经常不够明确',description:'记了很多讨论内容，但没有把决定转成具体行动。',priority:'中',tag:'工作效率',status:'处理中',resolution:'',logs:['记录问题：尝试在会议结束前列出下一步。']},{id:'p4',title:'早上总花很久决定先做什么',description:'每天提前挑出三件值得推进的事。',priority:'低',tag:'个人管理',status:'已解决',resolution:'连续一周在前一天写好优先事项，第二天可以直接开始。',logs:['验证完成：提前规划减少了早晨的决策时间。']},{id:'p5',title:'收藏了很多文章，却很少真正用上',description:'试着把阅读收获变成一个可以尝试的小行动。',priority:'低',tag:'学习成长',status:'待梳理',resolution:'',logs:['记录问题：从输入到行动之间缺少一步。']}],tasks:[{id:'t1',title:'列出报表整理中最耗时的三个步骤',issueId:'p1',due:today,status:'进行中'},{id:'t2',title:'把散落的想法统一收集到一个清单',issueId:'p2',due:today,status:'待办'},{id:'t3',title:'整理上次会议的三条行动项',issueId:'p3',due:date(-1),status:'待办'},{id:'t4',title:'读完收藏文章，记下一个可用的方法',issueId:null,due:date(1),status:'待办'},{id:'t5',title:'连续一周提前写好第二天的重点',issueId:'p4',due:date(-1),status:'已完成'}]};

function setTaskDependencies(id,deps){
  const t=db.tasks.find(x=>x.id===id),error=dependencyError(db.tasks,id,deps);if(error)return error;
  if(['进行中','已完成'].includes(t.status)&&deps.some(id=>db.tasks.find(x=>x.id===id)?.status!=='已完成'))return '先将当前行动退回待办，再增加尚未完成的前置行动。';
  t.dependsOn=[...new Set(deps)];log(issue(t.issueId),'更新行动前置依赖：'+t.title);return '';
}
function dependenciesForm(id){
  const t=db.tasks.find(x=>x.id===id);if(!t)return;const choices=db.tasks.filter(x=>x.id!==id&&x.issueId===t.issueId).sort((a,b)=>a.order-b.order);
  show('设置前置行动',`<form id="dependencies-form" data-event-id="EVT-SUBMIT" data-id="${esc(id)}"><h3>${esc(t.title)}</h3><p class="tip">勾选必须先完成的行动。前置行动全部已完成后，才能开始或完成当前行动；取消不算完成。拖动调序只改变显示顺序，不会建立依赖。</p><div class="dependency-options">${choices.map(x=>`<label><input type="checkbox" name="prerequisite" value="${esc(x.id)}" data-event-id="EVT-FIELD" ${t.dependsOn.includes(x.id)?'checked':''}><span>${esc(x.title)}</span><small>${esc(x.status)}</small></label>`).join('')||'<p>同一问题下暂无其他行动，可先添加。</p>'}</div><div id="form-error" class="error" role="alert"></div><div class="modal-actions">${btn('取消','close')}<button type="submit" class="primary" data-event-id="EVT-SUBMIT">保存依赖</button></div></form>`);
}
function reorderTask(id,targetId,after=false){
  const t=db.tasks.find(x=>x.id===id),target=db.tasks.find(x=>x.id===targetId);if(!t||!target||t===target||t.issueId!==target.issueId)return false;
  const group=db.tasks.filter(x=>x.issueId===t.issueId).sort((a,b)=>a.order-b.order),old=group.indexOf(t);group.splice(old,1);const at=group.indexOf(target)+(after?1:0);group.splice(at,0,t);group.forEach((x,i)=>x.order=i);return true;
}
let pointerSort=null;
function clearSortMarks(){document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'))}
document.addEventListener('pointerdown',e=>{const handle=e.target.closest('.drag-handle'),row=handle?.closest('[data-task-row][draggable="true"]');if(!row||e.button!==0)return;e.preventDefault();pointerSort={id:row.dataset.taskRow,x:e.clientX,y:e.clientY,moved:false};handle.setPointerCapture?.(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!pointerSort)return;if(Math.abs(e.clientY-pointerSort.y)+Math.abs(e.clientX-pointerSort.x)>5)pointerSort.moved=true;if(!pointerSort.moved)return;clearSortMarks();document.querySelector(`[data-task-row="${CSS.escape(pointerSort.id)}"]`)?.classList.add('dragging');const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-task-row][draggable="true"]');target?.classList.add('drop-target')});
document.addEventListener('pointerup',e=>{if(!pointerSort)return;const state=pointerSort;pointerSort=null;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-task-row][draggable="true"]');clearSortMarks();if(state.moved&&target){const rect=target.getBoundingClientRect();if(reorderTask(state.id,target.dataset.taskRow,e.clientY>rect.top+rect.height/2))changed('显示顺序已保存，行动依赖保持不变')}});
document.addEventListener('pointercancel',()=>{pointerSort=null;clearSortMarks()});
let draggingTask=null;
document.addEventListener('dragstart',e=>{if(pointerSort){e.preventDefault();return}const row=e.target.closest('[data-task-row][draggable="true"]');if(!row)return;draggingTask=row.dataset.taskRow;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggingTask);row.classList.add('dragging')});
document.addEventListener('dragover',e=>{const row=e.target.closest('[data-task-row][draggable="true"]');if(row&&draggingTask){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));row.classList.add('drop-target')}});
document.addEventListener('drop',e=>{const row=e.target.closest('[data-task-row][draggable="true"]');if(!row||!draggingTask)return;e.preventDefault();const after=e.clientY>row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;if(reorderTask(draggingTask,row.dataset.taskRow,after))changed('显示顺序已保存，行动依赖保持不变');draggingTask=null});
document.addEventListener('dragend',()=>{draggingTask=null;document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'))});

function addFollowup(p,content){
  const text=String(content||'').trim();
  if(!text)return '请写一点跟进内容，不能只输入空格。';
  if(text.length>5000)return '跟进内容最多5000字。';
  p.followups.push({id:uid(),content:text,at:new Date().toISOString(),actor:currentProfile().name});

}

function workflowForm(action,id){
  const p=issue(id);if(!p)return;
  const input=(name,value='',extra='')=>`<input data-event-id="EVT-FIELD" name="${name}" value="${esc(value)}" ${extra}>`;
  const area=(name,value='',hint='')=>`<textarea data-event-id="EVT-FIELD" name="${name}" required maxlength="5000" placeholder="${hint}">${esc(value)}</textarea>`;
  let title='',body='';
  if(action==='triage'){title='把问题梳理清楚';body=field('下一步做什么？',area('nextStep',p.nextStep||linked(id)[0]?.title||'','例如：整理重复操作步骤'))+field('怎样才算解决？',area('successCriteria',p.successCriteria,'例如：每天整理报表不超过10分钟'))}
  if(action==='verify'){
    if(remaining(id).length){toast('还有未完成的必要行动。请先完成、说明原因取消，或标记为可以以后做。');return}
    title='提交验证';body=field('解决标准',area('successCriteria',p.successCriteria))+field('已经做了什么，或观察到了什么？',area('treatment',p.treatment))+field('准备怎样确认效果？',area('verificationMethod',p.verificationMethod,'例如：观察接下来三个工作日的耗时'));
  }
  if(action==='resolve'){title='确认问题已解决';body=field('验证结论与依据',area('resolution','','例如：连续三天观察，报表耗时均低于10分钟。'))}
  if(action==='pause'){title='暂缓这个问题';body=field('暂缓原因',area('reason'))+field('下次回看日期',input('reviewDate',date(7),`type="date" required min="${today}"`))}
  if(action==='close-issue'){
    title='关闭问题';body=field('关闭类型',`<select name="closeType" data-event-id="EVT-FIELD">${['不再处理','重复问题','问题不成立','收益不足'].map(s=>`<option>${s}</option>`).join('')}</select>`)+field('关闭原因',area('reason'))+field('如果重复，关联原问题',`<select name="duplicateOf" data-event-id="EVT-FIELD"><option value="">不关联</option>${db.issues.filter(x=>x.id!==id).map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select>`)+(linked(id).some(t=>!['已完成','已取消'].includes(t.status))?field('未完成的关联行动如何处理？',`<select name="taskPolicy" data-event-id="EVT-FIELD"><option value="">请选择</option><option value="detach">解除关联，保留为独立待办</option><option value="cancel">取消这些行动，并记录关闭原因</option></select>`):'');
  }
  if(['reject','reopen','retriage'].includes(action)){title={reject:'验证未通过',reopen:'重新打开问题',retriage:'重新梳理'}[action];body=field('请简要说明原因',area('reason'))}
  if(action==='start'){
    if(!p.nextStep.trim()||!p.successCriteria.trim()){toast('请先重新梳理，补充下一步与解决标准。');return}
    const error=transitionIssue(p,action,{});if(error){toast(error);return}changed('已开始处理');detail(id);return;
  }
  if(action==='resume'){const error=transitionIssue(p,action,{});if(error){toast(error);return}changed('已恢复到原阶段');detail(id);return}
  if(!title)return;
  show(title,`<form id="workflow-form" data-event-id="EVT-SUBMIT" data-id="${esc(id)}" data-transition="${action}"><p style="margin-bottom:18px">${esc(p.title)} · ${esc(p.status)}</p>${body}<div id="form-error" class="error" role="alert"></div><div class="modal-actions">${btn('返回详情','detail',id)}<button type="submit" class="primary" data-event-id="EVT-SUBMIT">${title==='把问题梳理清楚'?'保存为待处理':title}</button></div></form>`);
}
function transitionIssue(p,action,v){
  const allowed={triage:['待梳理'],start:['待处理'],verify:['待梳理','待处理','处理中'],resolve:['待验证'],reject:['待验证'],pause:OPEN_STATES,resume:['已暂缓'],'close-issue':[...OPEN_STATES,'已暂缓'],reopen:['已解决','已关闭'],retriage:['待处理']};
  if(!allowed[action]?.includes(p.status))return '当前状态不允许这个操作，请重新打开详情。';
  const text=k=>String(v[k]||'').trim();
  if(action==='triage'&&(!text('nextStep')||!text('successCriteria')))return '请填写下一步和解决标准。';
  if(action==='start'&&(!p.nextStep.trim()||!p.successCriteria.trim()))return '请先完成梳理。';
  if(action==='verify'){
    if(p.status!=='处理中'&&linked(p.id).length)return '请先开始处理，再提交验证。';
    if(remaining(p.id).length)return '还有未完成的必要行动。';
    if(!text('successCriteria')||!text('treatment')||!text('verificationMethod'))return '请填写解决标准、处理说明和验证方式。';
  }
  if(action==='resolve'&&(remaining(p.id).length||!text('resolution')))return '请完成必要行动并填写验证结论。';
  if(['pause','close-issue','reject','reopen','retriage'].includes(action)&&!text('reason'))return '请填写原因，不能只输入空格。';
  if(action==='pause'&&(!/^\d{4}-\d{2}-\d{2}$/.test(text('reviewDate'))||text('reviewDate')<today))return '回看日期不能早于今天。';
  if(action==='close-issue'){
    if(!['不再处理','重复问题','问题不成立','收益不足'].includes(v.closeType))return '请选择关闭类型。';
    if(v.closeType==='重复问题'&&(!issue(v.duplicateOf)||v.duplicateOf===p.id))return '请选择另一个原问题。';
    if(linked(p.id).some(t=>!['已完成','已取消'].includes(t.status))&&!['detach','cancel'].includes(v.taskPolicy))return '请选择如何处置未完成行动。';
    if(v.taskPolicy==='detach'&&linked(p.id).some(t=>!['已完成','已取消'].includes(t.status)&&(t.dependsOn.length||db.tasks.some(x=>x.dependsOn.includes(t.id)))))return '这些行动已有依赖，请先解除前置与后续依赖，或选择取消行动。';
  }
  const targets={triage:'待处理',start:'处理中',verify:'待验证',resolve:'已解决',reject:'处理中',pause:'已暂缓','close-issue':'已关闭',retriage:'待梳理',reopen:p.status==='已关闭'?'待梳理':'处理中',resume:OPEN_STATES.includes(p.pausedFrom)?p.pausedFrom:'待梳理'};
  if(action==='resume'&&targets.resume==='待验证'&&remaining(p.id).length)targets.resume='处理中';
  if(action==='triage'){p.nextStep=text('nextStep');p.successCriteria=text('successCriteria')}
  if(action==='verify'){p.treatment=text('treatment');p.verificationMethod=text('verificationMethod');p.successCriteria=text('successCriteria')}
  if(action==='resolve')p.resolution=text('resolution');
  if(action==='pause'){p.pausedFrom=p.status;p.pauseReason=text('reason');p.reviewDate=text('reviewDate')}
  if(action==='close-issue'){
    p.closeReason=text('reason');p.closeType=v.closeType;p.duplicateOf=v.closeType==='重复问题'?v.duplicateOf:'';
    for(const t of linked(p.id).filter(t=>!['已完成','已取消'].includes(t.status))){
      if(v.taskPolicy==='detach'){t.issueId=null;log(p,'保留为独立待办：'+t.title)}else{t.status='已取消';t.cancelReason='问题关闭：'+p.closeReason;log(p,'取消行动：'+t.title)}
    }
  }
  const reason=text('reason')||text('resolution')||({triage:'已明确下一步和解决标准',start:'开始执行方案',verify:'已提交处理说明与验证方式',resume:'到期回看后恢复处理'}[action]);
  setState(p,targets[action],reason);return '';
}

}
function changeTask(t,action){
  const p=issue(t.issueId);
  if(p&&['已暂缓','已关闭'].includes(p.status)){toast('请先在问题详情恢复或重新打开，再推进关联行动。');return}
  const to=action==='toggle'?(['已完成','已取消'].includes(t.status)?'待办':'已完成'):(t.status==='待办'?'进行中':'待办');
  if(['进行中','已完成'].includes(to)&&blockedBy(t).length){toast('请先完成前置行动：'+blockedBy(t).map(x=>x?.title||'失效行动').join('、'));return}
  if(t.status==='已完成'&&to!=='已完成'&&hasStartedDependents(t)){toast('已有后续行动正在执行或已完成，请先将后续行动退回待办。');return}
  if(p?.status==='待梳理'&&['进行中','已完成'].includes(to)){toast('请先完成问题梳理，再开始关联行动。');detail(p.id);return}
  if(p?.status==='待处理'&&['进行中','已完成'].includes(to)){
    const error=transitionIssue(p,'start',{});if(error){toast(error);detail(p.id);return}
  }
  t.status=to;
  if(p&&t.required!==false&&['待验证','已解决'].includes(p.status)&&!['已完成','已取消'].includes(to))setState(p,'处理中','必要行动重新打开，需要再次验证');
  log(p,`行动“${t.title}”更新为${to}`);
  changed(p?.status==='处理中'&&remaining(p.id).length===0?'行动已更新，可以提交问题验证':'行动状态已更新');if($('#modal').open&&p)detail(p.id);
}

function submitRecord(f,v){
  const id=f.dataset.id;
  if(!id&&(!Object.hasOwn(TOOLS,v.creationVia||'manual')||v.creationVia==='unknown'||!(v.creationPerson==='ai'||profiles.some(x=>x.kind==='person'&&x.id===v.creationPerson))||(v.creationVia==='manual'&&v.creationPerson==='ai')))return '请选择有效的创建人和来源。';
  if(!v.title.trim())return '请用一句话描述，不能只输入空格。';
  v.title=v.title.trim();
  if(f.dataset.kind==='issue'){
    if(id){const p=issue(id);Object.assign(p,{title:v.title,description:v.description,priority:v.priority,tag:String(v.tag||'').trim()||'未分类'});log(p,'更新问题内容。')}
    else{const p={id:uid(),...creationValues(v),title:v.title,description:v.description||'',priority:v.priority||'中',tag:String(v.tag||'').trim()||'未分类',status:'待梳理',resolution:'',logs:['记录问题：默认待梳理'],history:[]};db.issues.unshift(p);normalizeData(db)}
  }else{
    const old=id?db.tasks.find(t=>t.id===id):null,newId=v.issueId||null,p=issue(newId),required=v.required!=='later';
    if(newId&&!p)return '关联问题不存在。';
    if(p&&['已暂缓','已关闭','已解决'].includes(p.status)&&(!old||old.issueId!==newId))return '请先恢复或重新打开目标问题，再新增行动。';
    if(old&&old.issueId!==newId&&(old.dependsOn.length||db.tasks.some(x=>x.dependsOn.includes(old.id))))return '请先解除当前行动的前置和后续依赖，再修改关联问题。';
    if(old&&old.issueId!==newId&&p?.status==='待梳理'&&old.status==='进行中')return '请先梳理目标问题，或将行动退回待办再关联。';
    if(old&&old.issueId!==newId&&p?.status==='待处理'&&old.status==='进行中'){
      const error=transitionIssue(p,'start',{});if(error)return error;
    }
    if(p&&['已暂缓','已关闭'].includes(p.status)&&old?.required===false&&required)return '请先恢复问题，再把行动改为必须先做。';
    const values={title:v.title,issueId:newId,due:v.due||'',required};
    if(old){const previous=issue(old.issueId);Object.assign(old,values);if(previous&&previous!==p)log(previous,'解除行动关联：'+old.title)}else db.tasks.unshift({id:uid(),...creationValues(v),...values,status:'待办',cancelReason:'',dependsOn:[],order:Math.max(-1,...db.tasks.filter(t=>t.issueId===newId).map(t=>t.order))+1});
    const task=old||db.tasks[0];
    if(p&&required&&!['已完成','已取消'].includes(task.status)&&['待验证','已解决'].includes(p.status))setState(p,'处理中','新增或重新指定必要行动，需要再次验证');
    log(p,(old?'更新':'新增')+'行动：'+v.title);
  }
  return '';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-event-id="EVT-ACTION"]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
  if(a==='nav'){view=id;if(id==='tasks')taskFilter=null;render()}
  else if(a==='select-task-issue'){selectedTaskIssue=id;render()}
  else if(a==='task-dependencies')dependenciesForm(id);

  else if(a==='board-action-status'){taskActionStatus=id;render()}

  else if(a==='task-grouping'){taskGrouping=id;render()}
  else if(a==='analysis-tab'){analysisTab=id;render()}
  else if(a==='overview-task-status'||a==='overview-task-due'){taskFilter={kind:a==='overview-task-status'?'status':'due',value:id};view='tasks';render()}
  else if(a==='clear-task-filter'){taskFilter=null;render()}
  else if(a==='status-filter'){view='issues';scope=id;render()}
  else if(a==='overview-state'||a==='overview-category'){view='issues';query='';priority='全部';scope=a==='overview-state'?id:'全部';category=a==='overview-category'?id:'';render()}

  else if(a==='new')edit('issue');else if(a==='new-task')edit('task');else if(a==='close')closeDialog();else if(a==='detail'){if(document.querySelector('#child-modal[open]')&&id===parentIssueId)closeDialog();else detail(id)}
  else if(a==='new-linked'){const p=issue(id);if(p&&OPEN_STATES.includes(p.status))edit('task',null,id);else toast('请先恢复或重新打开问题。')}
  else if(a==='edit-task')edit('task',id);else if(a==='edit-issue')edit('issue',id);
  else if(a==='toggle'||a==='advance'){const t=db.tasks.find(t=>t.id===id);if(t)changeTask(t,a)}
  else if(a==='cancel-task')cancelTaskForm(id);
  else if(a==='followup')followupForm(id);
  else if(['triage','start','verify','resolve','reject','pause','resume','close-issue','reopen','retriage'].includes(a))workflowForm(a,id);
  else if(a==='export'){const blob=new Blob([JSON.stringify({...db,identityProfiles:profiles,activeProfileId},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='拾序记录-'+today+'.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前全部问题、行动与状态记录')}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.eventId==='EVT-FILTER'&&e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}

document.addEventListener('change',e=>{if(e.target.dataset.eventId==='EVT-BOARD-FILTER'){if(e.target.id==='board-issue-status')taskIssueStatus=e.target.value;else taskActionStatus=e.target.value;render()}else if(e.target.dataset.eventId==='EVT-FILTER'){if(e.target.id==='priority')priority=e.target.value;if(e.target.id==='category')category=e.target.value;render()}else if(e.target.dataset.eventId==='EVT-KIND'){const title=$('[name="title"]').value;edit(e.target.value);$('[name="title"]').value=title}});
document.addEventListener('submit',e=>{
  if(e.target.dataset.eventId!=='EVT-SUBMIT'||e.target.id==='profile-form')return;e.preventDefault();
  const f=e.target,v=Object.fromEntries(new FormData(f)),id=f.dataset.id;let error='',returnId=null;
  if(f.id==='attributes-form'){const p=issue(id),tag=String(v.tag||'').trim();if(!p)error='问题不存在';else if(!['高','中','低'].includes(v.priority)||tag.length>40)error='请选择优先级，分类不超过40字。';else{p.priority=v.priority;p.tag=tag||'未分类';log(p,'修改优先级与分类。');if(f.dataset.return==='detail')returnId=id}}
  else if(f.id==='background-form'){const p=issue(id);if(!p)error='问题不存在';else if(String(v.description||'').length>5000)error='背景最多5000字。';else{p.description=String(v.description||'').trim();log(p,'更新问题背景。');returnId=id}}
  else if(f.id==='followup-form'){const p=issue(id);error=p?addFollowup(p,v.content):'问题不存在';returnId=id}
  else if(f.id==='workflow-form'){const p=issue(id);error=p?transitionIssue(p,f.dataset.transition,v):'问题不存在';returnId=id}
  else if(f.id==='dependencies-form'){error=setTaskDependencies(id,new FormData(f).getAll('prerequisite'))}

  else error=submitRecord(f,v);
  if(error){$('#form-error').textContent=error;return}
  const nested=!!document.querySelector('#child-modal[open]');changed('已保存');closeDialog(true);if(returnId&&!nested)detail(returnId);
});

function mobileToday(){
 const ts=pending().filter(t=>t.due&&t.due<=today&&!['已暂缓','已关闭'].includes(issue(t.issueId)?.status)).sort((a,b)=>a.due.localeCompare(b.due));
