<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾序 · 移动端原型预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ede3;color:#293e33;font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 22px;border-bottom:1px solid #d9e0d1;background:#f7f8f2}h1{font-size:16px;margin:0}p{font-size:12px;color:#667761;margin:3px 0 0}.tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #ced9c5;background:#fff;color:#42684e;padding:8px 12px;border-radius:8px;font:inherit;min-height:40px;cursor:pointer;text-decoration:none}button.active{background:#42684e;color:#fff;border-color:#42684e}.stage{display:flex;justify-content:center;padding:24px 12px}.device{width:390px;max-width:100%;background:#fff;border:1px solid #d0d9c7;border-radius:22px;overflow:hidden;box-shadow:0 18px 60px #28402b18}iframe{display:block;width:100%;height:844px;max-height:calc(100dvh - 145px);border:0;background:#f5f6f0}button:focus-visible,a:focus-visible{outline:3px solid #8da67c;outline-offset:2px}@media(max-width:520px){header{padding:12px;align-items:flex-start;flex-direction:column}.stage{padding:10px}.device{border-radius:14px}iframe{height:844px;max-height:calc(100dvh - 158px)}}
</style></head><body><header><div><h1>拾序 · 移动端原型</h1><p>点击体验首页、行动、日程和问题详情</p></div><div class="tools" aria-label="预览屏幕宽度"><button data-width="360">360px</button><button data-width="390" class="active" aria-pressed="true">390px</button><button data-width="430">430px</button><a href="prototype.html" target="_blank" rel="noopener">独立打开 ↗</a></div></header><main class="stage"><div class="device"><iframe src="prototype.html" title="拾序可交互移动端原型"></iframe></div></main><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.device').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button))})}));</script></body></html>
