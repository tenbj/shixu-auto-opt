function normalizeData(data) {
  if(data.version!==1||!Array.isArray(data.issues)||!Array.isArray(data.tasks))throw Error('Unsupported data');
  const numbers=new Set();
  let nextNumber=Number.isSafeInteger(data.nextIssueNumber)&&data.nextIssueNumber>0?data.nextIssueNumber:1;
  for(const p of data.issues)if(Number.isSafeInteger(p.number)&&p.number>0)nextNumber=Math.max(nextNumber,p.number+1);
  for(const p of data.issues){
    if(!Number.isSafeInteger(p.number)||p.number<1||numbers.has(p.number)){p.number=nextNumber++;numberingMigrated=true}
    numbers.add(p.number);
  }
  if(data.nextIssueNumber!==nextNumber){data.nextIssueNumber=nextNumber;numberingMigrated=true}
  const ids=new Set();
  for(const p of data.issues){
    if(!p.id||ids.has(p.id)||typeof p.title!=='string'||!ISSUE_STATES.includes(p.status))throw Error('Invalid issue');
    ids.add(p.id);
    for(const key of ['description','resolution','nextStep','successCriteria','treatment','verificationMethod','pauseReason','reviewDate','pausedFrom','closeReason','closeType','duplicateOf'])if(typeof p[key]!=='string')p[key]='';
    p.logs=Array.isArray(p.logs)?p.logs:[];p.history=Array.isArray(p.history)?p.history:[];p.followups=Array.isArray(p.followups)?p.followups:[];
    p.tag=String(p.tag||'').trim()||'未分类';p.priority=['高','中','低'].includes(p.priority)?p.priority:'中';
  }
  const taskIds=new Set();
  for(const t of data.tasks){if(!t.id||taskIds.has(t.id)||typeof t.title!=='string'||!['待办','进行中','已完成','已取消'].includes(t.status)||(t.issueId&&!ids.has(t.issueId)))throw Error('Invalid task');taskIds.add(t.id);t.required=t.required!==false;t.cancelReason=t.cancelReason||'';}
  data.tasks.forEach((t,i)=>{if(!Number.isFinite(t.order)){t.order=i;numberingMigrated=true}if(t.dependsOn===undefined){t.dependsOn=[];numberingMigrated=true}if(!Array.isArray(t.dependsOn))throw Error('Invalid dependencies');t.dependsOn=[...new Set(t.dependsOn)];});
  for(const t of data.tasks)if(dependencyError(data.tasks,t.id,t.dependsOn))throw Error('Invalid dependency graph');
  ensureTaskNumbers(data);data.schemaVersion=2;return data;
}
function ensureTaskNumbers(data){
 const counters=data.nextTaskNumbers&&typeof data.nextTaskNumbers==='object'?data.nextTaskNumbers:{};data.nextTaskNumbers=counters;
 const group=t=>String(data.issues.find(p=>p.id===t.issueId)?.number||'独立');
 for(const t of data.tasks)if(t.numberGroup===group(t)&&Number.isSafeInteger(t.sequence)&&t.sequence>0)counters[group(t)]=Math.max(Number(counters[group(t)])||1,t.sequence+1);
 const used=new Set();
 for(const t of data.tasks){const g=group(t);if(t.numberGroup!==g||!Number.isSafeInteger(t.sequence)||t.sequence<1||used.has(g+'-'+t.sequence)){t.numberGroup=g;t.sequence=Math.max(1,Number(counters[g])||1);counters[g]=t.sequence+1;numberingMigrated=true}used.add(g+'-'+t.sequence)}

function dependencyError(tasks,id,deps){

function issueCard(p){
  const latest=p.followups.at(-1),next=linked(p.id).filter(t=>!['已完成','已取消'].includes(t.status)).sort((a,b)=>Number(b.required!==false)-Number(a.required!==false))[0];
  return `<div class="list-issue issue-card ${p.priority==='高'?'priority-high':''}"><div class="issue-heading"><div class="issue-name">${numberBadge(p)}${btn(esc(p.title),'detail',p.id,'issue-title')}</div>${stateBadge(p)}</div><p class="issue-description">${esc(p.description||'还没有补充描述')}</p>${next?`<div class="issue-next"><span>下一步</span>${btn(esc(next.title),'edit-task',next.id,'next-title')}</div>`:p.nextStep?`<div class="issue-next"><span>下一步</span><strong>${esc(p.nextStep)}</strong></div>`:''}${latest?`<div class="latest-followup"><span>最近跟进</span><p>${esc(latest.content)}</p></div>`:''}<div class="issue-bottom"><div class="meta">${issueAttributes(p)}<span>${linked(p.id).length} 项行动</span><span>${p.followups.length} 条跟进</span></div><div class="issue-card-actions">${btn('＋ 记跟进','followup',p.id,'subtle')}${btn('详情 →','detail',p.id,'subtle')}</div></div></div>`;
}
async function workflowForm(action,id){
  const p=issue(id);if(!p)return;
  const input=(name,value='',extra='')=>`<input data-event-id="EVT-FIELD" name="${name}" value="${esc(value)}" ${extra}>`;
  const area=(name,value='',hint='')=>`<textarea data-event-id="EVT-FIELD" name="${name}" required maxlength="5000" placeholder="${hint}">${esc(value)}</textarea>`;
  let title='',body='';
  if(action==='triage'){title='把问题梳理清楚';body=field('下一步做什么？',area('nextStep',p.nextStep||linked(id)[0]?.title||'','例如：整理重复操作步骤'))+field('怎样才算解决？',area('successCriteria',p.successCriteria,'例如：每天整理报表不超过10分钟'))}
  if(action==='verify'){
    if(remaining(id).length){toast('还有未完成的必要行动。请先完成、说明原因取消，或标记为可以以后做。');return}
    title='提交验证';body=field('解决标准',area('successCriteria',p.successCriteria))+field('已经做了什么，或观察到了什么？',area('treatment',p.treatment))+field('准备怎样确认效果？',area('verificationMethod',p.verificationMethod,'例如：观察接下来三个工作日的耗时'));
  }
  if(action==='resolve'){title='确认问题已解决';body=field('验证结论与依据',area('resolution','','例如：连续三天观察，报表耗时均低于10分钟。'))}
  if(action==='pause'){title='暂缓这个问题';body=field('暂缓原因',area('reason'))+field('下次回看日期',input('reviewDate',date(7),`type="date" required min="${today}"`))}
  if(action==='close-issue'){
    title='关闭问题';body=field('关闭类型',`<select name="closeType" data-event-id="EVT-FIELD">${['不再处理','重复问题','问题不成立','收益不足'].map(s=>`<option>${s}</option>`).join('')}</select>`)+field('关闭原因',area('reason'))+field('如果重复，关联原问题',`<select name="duplicateOf" data-event-id="EVT-FIELD"><option value="">不关联</option>${db.issues.filter(x=>x.id!==id).map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select>`)+(linked(id).some(t=>!['已完成','已取消'].includes(t.status))?field('未完成的关联行动如何处理？',`<select name="taskPolicy" data-event-id="EVT-FIELD"><option value="">请选择</option><option value="detach">解除关联，保留为独立待办</option><option value="cancel">取消这些行动，并记录关闭原因</option></select>`):'');
  }
  if(['reject','reopen','retriage'].includes(action)){title={reject:'验证未通过',reopen:'重新打开问题',retriage:'重新梳理'}[action];body=field('请简要说明原因',area('reason'))}
  if(action==='start'){
    if(!p.nextStep.trim()||!p.successCriteria.trim()){toast('请先重新梳理，补充下一步与解决标准。');return}
    const error=await transitionIssue(p,action,{});if(error){toast(error);return}changed('已开始处理');detail(id);return;
  }
  if(action==='resume'){const error=await transitionIssue(p,action,{});if(error){toast(error);return}changed('已恢复到原阶段');detail(id);return}
  if(!title)return;
  show(title,`<form id="workflow-form" data-event-id="EVT-SUBMIT" data-id="${esc(id)}" data-transition="${action}"><p style="margin-bottom:18px">${esc(p.title)} · ${esc(p.status)}</p>${body}<div id="form-error" class="error" role="alert"></div><div class="modal-actions">${btn('返回详情','detail',id)}<button type="submit" class="primary" data-event-id="EVT-SUBMIT">${title==='把问题梳理清楚'?'保存为待处理':title}</button></div></form>`);
}
async function transitionIssue(p,action,values){
 try{await mutate(`/api/issues/${p.id}/transitions`,'POST',{action,...values});return ''}catch(e){return e.message}
}
function taskHTML(t,grouped=false){
  grouped=grouped===true;
  const p=issue(t.issueId),finished=['已完成','已取消'].includes(t.status);
  return `<div class="task ${finished?'done':''}"><button data-event-id="EVT-ACTION" data-action="toggle" data-id="${esc(t.id)}" class="check" aria-label="${finished?'重新打开':'完成'}：${esc(t.title)}">${t.status==='已完成'?'✓':t.status==='已取消'?'−':''}</button><div class="taskbody"><h3>${esc(t.title)}</h3><div class="meta"><span class="${t.due&&t.due<today&&!finished?'late':''}">${dueLabel(t)}</span>${!grouped?`<span>·</span>${p?btn('↗ '+esc(issueCode(p))+' · '+esc(p.title),'detail',p.id,'source'):'<span>独立待办</span>'}`:''}</div><div class="meta task-status">${btn('行动 · '+t.status+' ✎','edit-task',t.id,'meta-edit')}${btn((t.required===false?'可以以后做':'必须先做')+' ✎','edit-task',t.id,'meta-edit')}</div>${p&&!grouped?`<div class="task-problem-status">问题状态：${esc(p.status)}</div>`:''}<div class="task-actions">${!finished?btn(t.status==='待办'?'开始行动 →':'退回待办','advance',t.id,'nextbtn'):''}${btn('编辑','edit-task',t.id,'nextbtn')}${!finished?btn('取消行动','cancel-task',t.id,'nextbtn'):''}</div>${t.status==='已取消'?`<p class="tip">取消原因：${esc(t.cancelReason)}</p>`:''}</div></div>`;
}
async function changeTask(t,action){
 const status=action==='toggle'?(['已完成','已取消'].includes(t.status)?'待办':'已完成'):(t.status==='待办'?'进行中':'待办');
 try{await mutate(`/api/tasks/${t.id}/transitions`,'POST',{status});changed('行动状态已保存');if(document.querySelector('#modal').open&&t.issueId)detail(t.issueId)}catch(e){toast(e.message)}
}
function cancelTaskForm(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;show('取消行动',`<form id="cancel-form" data-event-id="EVT-SUBMIT" data-id="${esc(id)}">${field('取消原因',`<textarea name="reason" required data-event-id="EVT-FIELD" maxlength="5000"></textarea>`)}<div id="form-error" role="alert" class="error"></div><div class="modal-actions">${btn('返回','close')}<button data-event-id="EVT-SUBMIT" type="submit" class="primary">确认取消</button></div></form>`)}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-event-id="EVT-ACTION"]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
  if(a==='nav'){view=id;if(id==='tasks')taskFilter=null;render()}
  else if(a==='select-task-issue'){selectedTaskIssue=id;render()}
  else if(a==='task-dependencies')dependenciesForm(id);
  else if(a==='task-up'||a==='task-down'){const t=db.tasks.find(x=>x.id===id);if(t){const group=db.tasks.filter(x=>x.issueId===t.issueId).sort((a,b)=>a.order-b.order),at=group.indexOf(t),target=group[at+(a==='task-up'?-1:1)];if(target&&await reorderTask(id,target.id,a==='task-down'))changed('显示顺序已保存')}}
  else if(a==='toggle-issue-pane'){issuePaneCollapsed=!issuePaneCollapsed;saveDeskLayout();render()}
  else if(a==='board-issue-status'){taskIssueStatus=id;render()}
  else if(a==='board-action-status'){taskActionStatus=id;render()}
  else if(a==='calendar-month'){if(id==='today')calendarMonth=today.slice(0,7);else{const [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+Number(id),1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}render()}
  else if(a==='task-grouping'){taskGrouping=id;render()}
  else if(a==='analysis-tab'){analysisTab=id;render()}
  else if(a==='overview-task-status'||a==='overview-task-due'){taskFilter={kind:a==='overview-task-status'?'status':'due',value:id};view='tasks';render()}
  else if(a==='clear-task-filter'){taskFilter=null;render()}
  else if(a==='status-filter'){view='issues';scope=id;render()}
  else if(a==='overview-state'||a==='overview-category'){view='issues';query='';priority='全部';scope=a==='overview-state'?id:'全部';category=a==='overview-category'?id:'';render()}
  else if(a==='edit-background')backgroundForm(id);
  else if(a==='edit-attributes')attributesForm(id);
  else if(a==='workflow-guide')workflowGuide('issues','');
  else if(a==='issue-guide')workflowGuide('issues',id);
  else if(a==='guide-tab')workflowGuide(id);
  else if(a==='new')edit('issue');else if(a==='new-task')edit('task');else if(a==='close')closeDialog();else if(a==='detail'){if(document.querySelector('#child-modal[open]')&&id===parentIssueId)closeDialog();else detail(id)}
  else if(a==='new-linked'){const p=issue(id);if(p&&OPEN_STATES.includes(p.status))edit('task',null,id);else toast('请先恢复或重新打开问题。')}
  else if(a==='edit-task')edit('task',id);else if(a==='edit-issue')edit('issue',id);
  else if(a==='toggle'||a==='advance'){const t=db.tasks.find(t=>t.id===id);if(t)changeTask(t,a)}
  else if(a==='cancel-task')cancelTaskForm(id);
  else if(a==='followup')followupForm(id);
  else if(['triage','start','verify','resolve','reject','pause','resume','close-issue','reopen','retriage'].includes(a))workflowForm(a,id);
  else if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='拾序记录-'+today+'.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前全部问题、行动与状态记录')}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.eventId==='EVT-FILTER'&&e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}
  if(e.target.dataset.eventId==='EVT-FIELD'&&$('#form-error'))$('#form-error').textContent='';
});
document.addEventListener('change',e=>{if(e.target.dataset.eventId==='EVT-BOARD-FILTER'){if(e.target.id==='board-issue-status')taskIssueStatus=e.target.value;else taskActionStatus=e.target.value;render()}else if(e.target.dataset.eventId==='EVT-FILTER'){if(e.target.id==='priority')priority=e.target.value;if(e.target.id==='category')category=e.target.value;render()}else if(e.target.dataset.eventId==='EVT-KIND'){const title=$('[name="title"]').value;edit(e.target.value);$('[name="title"]').value=title}});
document.addEventListener('submit',async e=>{
 if(e.target.dataset.eventId!=='EVT-SUBMIT')return;e.preventDefault();
 const f=e.target,v=Object.fromEntries(new FormData(f)),id=f.dataset.id;
 let route='',method='POST',values={},returnId=null;
 if(f.id==='attributes-form'){route=`/api/issues/${id}`;method='PATCH';values={priority:v.priority,tag:v.tag};if(f.dataset.return==='detail')returnId=id}
 else if(f.id==='background-form'){route=`/api/issues/${id}`;method='PATCH';values={description:v.description};returnId=id}
 else if(f.id==='followup-form'){route=`/api/issues/${id}/followups`;values={content:v.content};returnId=id}
 else if(f.id==='workflow-form'){route=`/api/issues/${id}/transitions`;values={action:f.dataset.transition,...v};returnId=id}
 else if(f.id==='dependencies-form'){route=`/api/tasks/${id}/dependencies`;values={dependsOn:new FormData(f).getAll('prerequisite')}}
 else if(f.id==='cancel-form'){route=`/api/tasks/${id}/transitions`;values={status:'已取消',reason:v.reason};returnId=db.tasks.find(t=>t.id===id)?.issueId}
 else if(f.id==='record-form'){
   const kind=f.dataset.kind==='issue'?'issues':'tasks';route=`/api/${kind}${id?'/'+id:''}`;method=id?'PATCH':'POST';
   values=kind==='issues'?{title:v.title,description:v.description,priority:v.priority,tag:v.tag}:{title:v.title,issueId:v.issueId||null,due:v.due||'',required:v.required!=='later'};
 }else return;
 const button=f.querySelector('[type=submit]');if(button)button.disabled=true;
 try{await mutate(route,method,values);const nested=!!document.querySelector('#child-modal[open]');changed('已保存到服务端');closeDialog(true);if(returnId&&!nested)detail(returnId)}
 catch(e){const error=f.querySelector('#form-error');if(error)error.textContent=e.message;else toast(e.message)}
 finally{if(button)button.disabled=false}
});

function showConnection(message){const el=document.querySelector('#storage-warning');el.replaceChildren(document.createTextNode(message+' '));el.classList.remove('hidden');const b=document.createElement('button');b.textContent='重新连接';b.onclick=()=>loadWorkspace();el.append(b)}
async function request(route,options={}){
 const response=await fetch(route,{...options,headers:{'Content-Type':'application/json',...options.headers},signal:AbortSignal.timeout(15000)});
 const result=await response.json();if(!response.ok){const e=new Error(typeof result.detail==='string'?result.detail:'输入不符合要求，请检查必填内容和长度');e.status=response.status;throw e}return result;
}
async function loadWorkspace(){
 try{const result=await request('/api/workspace');db=result.data;revision=result.revision;loaded=true;document.querySelector('#storage-warning').classList.add('hidden');render();document.querySelector('#sync-state').textContent='已同步 · '+revision}
 catch(e){loaded=false;showConnection('连接服务失败，尚未加载记录。');document.querySelector('#app').textContent='服务暂时不可用，请恢复连接后重试。'}
}
async function mutate(route,method,values){
 if(!loaded)throw Error('请先连接服务');if(busy)throw Error('正在保存，请稍候');
 const signature=JSON.stringify([route,method,values]);
 if(pendingWrite&&pendingWrite.signature!==signature)throw Error('上一笔请求结果未确认，请先重试原操作，避免重复或丢失记录。');
 if(!pendingWrite)pendingWrite={signature,body:{...values,request_id:uid(),expected_version:revision,actor:'我'}};
 busy=true;document.querySelector('#sync-state').textContent='保存中…';
 try{
   const result=await request(route,{method,body:JSON.stringify(pendingWrite.body)});
   pendingWrite=null;db=result.data;revision=result.revision;render();document.querySelector('#storage-warning').classList.add('hidden');
   document.querySelector('#sync-state').textContent='已同步 · '+revision;return result;
 }catch(e){
   if(e.status&&e.status<500)pendingWrite=null;
   if(e.status===409){await loadWorkspace();e.message+='；已刷新工作台，请检查当前内容再提交。'}
   else if(!e.status||e.status>=500){showConnection('本次保存结果尚未确认，请恢复连接后重试相同操作。');e.message='保存结果未确认；请重试相同操作（保留幂等编号）。'}
   document.querySelector('#sync-state').textContent='保存未完成';throw e;
 }finally{busy=false}
}
document.querySelector('#sync-button').onclick=()=>loadWorkspace();
loadWorkspace();

</script></body></html>
