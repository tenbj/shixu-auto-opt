function syncCustomToolField(f){const box=f.querySelector('.custom-tool-field'),input=f.elements.profileCustomTool,on=f.elements.profileKind.value==='agent'&&f.elements.profileVia.value==='__custom__';box.classList.toggle('hidden',!on);input.disabled=!on;input.required=on}

function identitySettings(){show('记录身份',`<p class="identity-explain">为人或 AI 设置记录身份，新记录会自动带入。名称可自定义，已有记录保留原始信息。</p><div class="identity-list">${profiles.map(p=>`<div class="identity-item">${btn(`<strong>${esc(p.name)}</strong><small>${p.kind==='agent'?esc(TOOLS[p.via])+' · '+esc(p.modelName||'模型未提供'):'个人身份'}</small>${p.id===activeProfileId?'<span>当前使用</span>':''}`,'use-profile',p.id,'profile-choice '+(p.id===activeProfileId?'selected':''))}${btn('编辑','edit-profile',p.id,'subtle')}</div>`).join('')}</div><div class="modal-actions">${btn('＋ 添加身份','add-profile','','primary')}${btn('返回','close')}</div>`)}
function profileForm(id){const x=profiles.find(p=>p.id===id);show(x?'编辑记录身份':'添加记录身份',`<form id="profile-form" data-event-id="EVT-SUBMIT" data-id="${esc(id||'')}">${field('身份名称',`<input name="profileName" data-event-id="EVT-FIELD" required maxlength="60" value="${esc(x?.name||'')}" placeholder="例如：姓名、昵称或AI助手名称">`)}${field('身份类型',`<select name="profileKind" ${x?'disabled':''} data-event-id="EVT-IDENTITY"><option value="person" ${x?.kind==='agent'?'':'selected'}>人</option><option value="agent" ${x?.kind==='agent'?'selected':''}>AI</option></select>`)}<div class="profile-ai-fields ${x?.kind==='agent'?'':'hidden'}">${field('AI 工具',`<select name="profileVia" data-event-id="EVT-FIELD">${Object.entries(TOOLS).filter(([id])=>!['manual','unknown'].includes(id)).map(([id,name])=>`<option value="${esc(id)}" ${(x?.via||'codex')===id?'selected':''}>${esc(name)}</option>`).join('')}<option value="__custom__">＋ 其他 / 自定义工具</option></select>`)}<div class="custom-tool-field hidden">${field('自定义工具名称',`<input name="profileCustomTool" data-event-id="EVT-FIELD" maxlength="80" disabled placeholder="例如：Cursor、Gemini CLI 或其他工具">`)}<p class="muted">保存后加入工具列表，下次可直接选择。</p></div>${field('模型名称 / ID · 选填',`<input name="profileModel" data-event-id="EVT-FIELD" maxlength="160" value="${esc(x?.modelName||'')}" placeholder="模型实际名称或标识">`)}${field('模型提供方 · 选填',`<input name="profileProvider" data-event-id="EVT-FIELD" maxlength="80" value="${esc(x?.modelProvider||'')}" placeholder="例如：OpenAI">`)}</div><div id="form-error" class="error" role="alert"></div><div class="modal-actions">${btn('返回','identity-settings')}<button type="submit" data-event-id="EVT-SUBMIT" class="primary">保存并使用</button></div></form>`)}
function creationPerson(r){return r.initiatedByPersonId||r.createdByActorId||'unknown'}
function creatorName(r){return r.creatorName||profiles.find(p=>p.id===creationPerson(r))?.name||(!['manual','unknown'].includes(r.createdVia)?TOOLS[r.createdVia]:'未知')}
function creatorLine(r){const via=r.createdVia||'unknown',name=creatorName(r),sameTool=!r.initiatedByPersonId&&name===TOOLS[via];return `<div class="creator-line" data-creator-person="${esc(creationPerson(r))}" data-creator-via="${esc(via)}"><span class="creator-person">${esc(name)}</span>${via==='unknown'?'<span class="creator-tool">来源未知</span>':via==='manual'?'<span class="creator-tool">创建</span>':sameTool?'':`<span class="creator-tool">经 ${esc(TOOLS[via])} 创建</span>`}${!['manual','unknown'].includes(via)?`<span class="creator-model">· ${esc(r.modelInfo?.name||'模型未提供')}</span>`:''}</div>`}
function creationDetail(r){return `<section class="creation-detail" aria-label="创建信息"><div><span>创建人</span>${esc(creatorName(r))}</div><div><span>创建来源</span>${esc(TOOLS[r.createdVia]||'未知来源')}</div><div><span>创建时间</span>${r.createdAt?esc(new Date(r.createdAt).toLocaleString('zh-CN')):'未记录'}</div>${!['manual','unknown'].includes(r.createdVia)?`<div><span>模型名称 / ID</span>${esc(r.modelInfo?.name||'模型未提供')}</div><div><span>模型提供方</span>${esc(r.modelInfo?.provider||'未提供')}</div>`:''}</section>`}
function creationFields(obj){if(obj)return creationDetail(obj);const c=currentProfile();return `<details class="creation-config"><summary>创建信息 · ${esc(c.name)}${c.kind==='agent'?' · '+esc(c.modelName||'模型未提供'):''}</summary>${field('实际记录身份',`<select name="creationIdentity" data-event-id="EVT-CREATION"><option value="">未指定（来源未知）</option>${profiles.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.name)} · ${x.kind==='agent'?esc(TOOLS[x.via]):'手动'}</option>`).join('')}</select>`)}${field('人类发起者 · AI代录时选填',`<select name="creationPerson" data-event-id="EVT-CREATION" ${c.kind!=='agent'?'disabled':''}><option value="ai">未指定人类发起者</option>${profiles.filter(x=>x.kind==='person').map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`)}<div class="grid2 model-fields ${c.kind!=='agent'?'hidden':''}">${field('模型名称 / ID · 选填',`<input name="modelName" maxlength="160" value="${esc(c.modelName||'')}" placeholder="实际模型名称或标识">`)}${field('模型提供方 · 选填',`<input name="modelProvider" maxlength="80" value="${esc(c.modelProvider||'')}">`)}</div><p>记录身份在右上角设置。工具随身份带入；未提供模型时留空。</p></details>`}
function creationValues(v){if(!v.creationIdentity)return null;const p=profiles.find(x=>x.id===v.creationIdentity);if(!p)throw Error('请重新选择记录身份');return {identityId:p.id,initiatedByPersonId:p.kind==='agent'&&v.creationPerson!=='ai'?v.creationPerson||null:null,modelInfo:p.kind==='agent'?{name:v.modelName||'',provider:v.modelProvider||''}:null}}

function creatorFilterBar(kind){const f=creatorFilters[kind],rows=kind==='issues'?db.issues:db.tasks,names=new Map(rows.map(r=>[creationPerson(r),creatorName(r)]));return `<div class="creator-filters" aria-label="创建信息筛选"><label>创建人<select data-event-id="EVT-CREATOR-FILTER" data-kind="${kind}" data-filter="person" aria-label="按创建人筛选"><option value="">全部创建人</option>${[...names].map(([id,n])=>`<option value="${esc(id)}" ${id===f.person?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>创建来源<select data-event-id="EVT-CREATOR-FILTER" data-kind="${kind}" data-filter="via" aria-label="按创建来源筛选"><option value="">全部来源</option>${Object.entries(TOOLS).map(([id,n])=>`<option value="${id}" ${id===f.via?'selected':''}>${n}</option>`).join('')}</select></label>${f.person||f.via?btn('清除创建筛选','clear-creator-filter',kind,'subtle'):''}</div>`}
function normalizeCreation(r){r.createdByActorId=typeof r.createdByActorId==='string'?r.createdByActorId:null;r.initiatedByPersonId=typeof r.initiatedByPersonId==='string'?r.initiatedByPersonId:null;r.creatorName=typeof r.creatorName==='string'?r.creatorName:null;r.createdVia=Object.hasOwn(TOOLS,r.createdVia)?r.createdVia:'unknown';r.createdAt=typeof r.createdAt==='string'&&Number.isFinite(Date.parse(r.createdAt))?r.createdAt:null;r.modelInfo=!['manual','unknown'].includes(r.createdVia)&&r.modelInfo&&typeof r.modelInfo==='object'?{name:String(r.modelInfo.name||'').slice(0,160),provider:String(r.modelInfo.provider||'').slice(0,80)}:null}
document.addEventListener('change',e=>{
const el=e.target;if(el.name==='profileKind'){el.closest('form').querySelector('.profile-ai-fields').classList.toggle('hidden',el.value!=='agent');syncCustomToolField(el.closest('form'))}if(el.name==='profileVia')syncCustomToolField(el.closest('form'));

});
document.addEventListener('click',e=>{const b=e.target.closest('[data-event-id="EVT-ACTION"]');if(!b)return;const a=b.dataset.action;if(a==='clear-creator-filter'){creatorFilters[b.dataset.id]={person:'',via:''};render()}if(a==='identity-settings')identitySettings();if(a==='add-profile')profileForm();if(a==='edit-profile')profileForm(b.dataset.id);if(a==='use-profile'){activeProfileId=b.dataset.id;persistProfiles();closeDialog();render();toast('新记录将使用 '+currentProfile().name)}});
document.addEventListener('submit',async e=>{if(e.target.id!=='profile-form')return;e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),old=profiles.find(p=>p.id===f.dataset.id),kind=old?.kind||v.profileKind;
const values={name:v.profileName,via:kind==='person'?'manual':v.profileVia,modelName:kind==='person'?'':v.profileModel,modelProvider:kind==='person'?'':v.profileProvider};if(!old)values.kind=kind;if(kind==='agent'&&v.profileVia==='__custom__')values.toolName=v.profileCustomTool?.trim()||'';

const ISSUE_STATES=['待梳理','待处理','处理中','待验证','已解决','已暂缓','已关闭'],OPEN_STATES=ISSUE_STATES.slice(0,4);
let db,view='today',query='',priority='全部',scope='全部',category='',analysisTab='issues',taskFilter=null,taskGrouping='issues',selectedTaskIssue='all',taskIssueStatus='全部',taskActionStatus='全部',calendarMonth=today.slice(0,7),issuePaneWidth=285,issuePaneCollapsed=false,numberingMigrated=false;

// Soft deletion retains every record in db; all ordinary views use these selectors.
function liveIssues(){return db.issues.filter(p=>!p.deletedAt)}
function liveTasks(){return db.tasks.filter(t=>!t.deletedAt&&(!t.issueId||liveIssues().some(p=>p.id===t.issueId)))}
function trashRecord(kind,id){return (kind==='issue'?db.issues:db.tasks).find(x=>x.id===id)}
function deletionError(kind,id){
 const obj=trashRecord(kind,id);if(!obj||obj.deletedAt)return '记录已经移入回收站，不能重复删除。';
 const targets=kind==='issue'?liveTasks().filter(t=>t.issueId===id):[obj],ids=new Set(targets.map(t=>t.id));
 const dependents=liveTasks().filter(t=>!ids.has(t.id)&&(t.dependsOn||[]).some(d=>ids.has(d)));
 if(dependents.length)return '无法删除：仍被有效行动依赖（'+dependents.map(t=>t.title).join('、')+'）。请先在这些行动中解除前置依赖。';
 return '';
}

function restoration(kind,id){

 const rows=kind==='issue'?db.tasks.filter(t=>t.deletedAt&&t.deletedWithIssue===id&&t.deletionBatch===obj.deletionBatch):[obj];
 const issues=kind==='issue'?[...liveIssues(),obj]:liveIssues(),tasks=[...liveTasks(),...rows];
 if(kind==='issue'&&obj.duplicateOf&&!issues.some(p=>p.id===obj.duplicateOf))return {error:'重复关联的原问题仍在回收站，请先恢复原问题。'};
 for(const t of rows){
  const p=issues.find(p=>p.id===t.issueId);
  if(t.issueId&&!p)return {error:'关联问题仍在回收站或不存在，请先恢复问题。'};
  const error=dependencyError(tasks,t.id,t.dependsOn||[]);if(error)return {error:'恢复受阻：'+error+' 请先恢复缺失的前置行动。'};
  if(['进行中','已完成'].includes(t.status)&&(t.dependsOn||[]).some(d=>tasks.find(x=>x.id===d)?.status!=='已完成'))return {error:'恢复受阻：进行中或已完成行动的前置行动尚未完成。请先处理前置行动。'};
  if(kind==='task'&&p&&['已暂缓','已关闭'].includes(p.status))return {error:'请先恢复处理或重新打开关联问题，再恢复行动。'};
 }
 const affected=issues.filter(p=>rows.some(t=>t.issueId===p.id)&&rows.some(t=>t.issueId===p.id&&t.required!==false&&!['已完成','已取消'].includes(t.status))&&(['待验证','已解决'].includes(p.status)||(p.status==='已暂缓'&&p.pausedFrom==='待验证')));
 return {obj,rows,affected};
}

function normalizeData(data) {

  if(data.nextIssueNumber!==nextNumber){data.nextIssueNumber=nextNumber;numberingMigrated=true}

    if(!p.id||ids.has(p.id)||typeof p.title!=='string'||!ISSUE_STATES.includes(p.status))throw Error('Invalid issue');

  for(const t of data.tasks){if(!t.id||taskIds.has(t.id)||typeof t.title!=='string'||!['待办','进行中','已完成','已取消'].includes(t.status)||(t.issueId&&!ids.has(t.issueId)))throw Error('Invalid task');taskIds.add(t.id);t.required=t.required!==false;t.cancelReason=t.cancelReason||'';}

function dependencyError(tasks,id,deps){
  const current=tasks.find(t=>t.id===id);if(!current)return '行动不存在。';
  if(deps.some(d=>d===id))return '行动不能依赖自己。';
  if(deps.some(d=>!tasks.some(t=>t.id===d&&t.issueId===current.issueId)))return '前置行动必须来自同一个问题。';
  const visiting=new Set(),visited=new Set();
  function visit(key){if(visiting.has(key))return true;if(visited.has(key))return false;visiting.add(key);const ds=key===id?deps:tasks.find(t=>t.id===key)?.dependsOn||[];if(ds.some(visit))return true;visiting.delete(key);visited.add(key);return false}
  return tasks.some(t=>visit(t.id))?'这些依赖形成循环，请调整前置行动。':'';
}
function blockedBy(t){return (t.dependsOn||[]).map(id=>liveTasks().find(x=>x.id===id)).filter(x=>!x||x.status!=='已完成')}
function hasStartedDependents(t){return liveTasks().some(x=>(x.dependsOn||[]).includes(t.id)&&['进行中','已完成'].includes(x.status))}

async function workflowForm(action,id){
  const p=issue(id);if(!p)return;
  const input=(name,value='',extra='')=>`<input data-event-id="EVT-FIELD" name="${name}" value="${esc(value)}" ${extra}>`;
  const area=(name,value='',hint='')=>`<textarea data-event-id="EVT-FIELD" name="${name}" required maxlength="5000" placeholder="${hint}">${esc(value)}</textarea>`;
  let title='',body='';
  if(action==='triage'){title='把问题梳理清楚';body=field('下一步做什么？',area('nextStep',p.nextStep||linked(id)[0]?.title||'','例如：整理重复操作步骤'))+field('怎样才算解决？',area('successCriteria',p.successCriteria,'例如：每天整理报表不超过10分钟'))}

    if(remaining(id).length){toast('还有未完成的必要行动。请先完成、说明原因取消，或标记为可以以后做。');return}
    title='提交验证';body=field('解决标准',area('successCriteria',p.successCriteria))+field('已经做了什么，或观察到了什么？',area('treatment',p.treatment))+field('准备怎样确认效果？',area('verificationMethod',p.verificationMethod,'例如：观察接下来三个工作日的耗时'));
  }

  if(action==='close-issue'){
    title='关闭问题';body=field('关闭类型',`<select name="closeType" data-event-id="EVT-FIELD">${['不再处理','重复问题','问题不成立','收益不足'].map(s=>`<option>${s}</option>`).join('')}</select>`)+field('关闭原因',area('reason'))+field('如果重复，关联原问题',`<select name="duplicateOf" data-event-id="EVT-FIELD"><option value="">不关联</option>${liveIssues().filter(x=>x.id!==id).map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select>`)+(linked(id).some(t=>!['已完成','已取消'].includes(t.status))?field('未完成的关联行动如何处理？',`<select name="taskPolicy" data-event-id="EVT-FIELD"><option value="">请选择</option><option value="detach">解除关联，保留为独立待办</option><option value="cancel">取消这些行动，并记录关闭原因</option></select>`):'');
  }
  if(['reject','reopen','retriage'].includes(action)){title={reject:'验证未通过',reopen:'重新打开问题',retriage:'重新梳理'}[action];body=field('请简要说明原因',area('reason'))}
  if(action==='start'){
    if(!p.nextStep.trim()||!p.successCriteria.trim()){toast('请先重新梳理，补充下一步与解决标准。');return}

function syncStatus(message){document.querySelector('#sync-state').textContent=message;const mobile=document.querySelector('#mobile-sync-state');if(mobile)mobile.textContent=message}
function showConnection(message){const el=document.querySelector('#storage-warning');el.replaceChildren(document.createTextNode(message+' '));el.classList.remove('hidden');const b=document.createElement('button');b.textContent='重新连接';b.onclick=()=>loadWorkspace();el.append(b)}
async function request(route,options={}){
 const response=await fetch(route,{...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken,...options.headers},signal:AbortSignal.timeout(15000)});
 const result=await response.json();if(!response.ok){if(response.status===401&&currentUser){currentUser=null;loaded=false;document.querySelectorAll('dialog[open]').forEach(d=>d.close());showLogin('login','登录已过期，请重新登录')}const e=new Error(typeof result.detail==='string'?result.detail:'输入不符合要求，请检查必填内容和长度');e.status=response.status;throw e}return result;
}
async function loadWorkspace(){
 try{const result=await request('/api/workspace');db=result.data;syncProfiles();revision=result.revision;loaded=true;document.querySelector('#storage-warning').classList.add('hidden');render();syncStatus('已同步 · '+revision)}
 catch(e){loaded=false;showConnection('连接服务失败，尚未加载记录。');syncStatus('连接失败');document.querySelector('#app').textContent='服务暂时不可用，请恢复连接后重试。'}
}
async function mutate(route,method,values){
 if(!loaded)throw Error('请先连接服务');if(busy)throw Error('正在保存，请稍候');
 const signature=JSON.stringify([route,method,values]);
 if(pendingWrite&&pendingWrite.signature!==signature)throw Error('上一笔请求结果未确认，请先重试原操作，避免重复或丢失记录。');
 if(!pendingWrite)pendingWrite={signature,body:{...values,request_id:uid(),expected_version:revision,actor:currentProfile().id?currentProfile().name:'未指定'}};
 busy=true;syncStatus('保存中…');
 try{
   const result=await request(route,{method,body:JSON.stringify(pendingWrite.body)});
   pendingWrite=null;db=result.data;syncProfiles();revision=result.revision;render();document.querySelector('#storage-warning').classList.add('hidden');
   syncStatus('已同步 · '+revision);return result;
 }catch(e){
   if(e.status&&e.status<500)pendingWrite=null;
   if(e.status===409){await loadWorkspace();e.message+='；已刷新工作台，请检查当前内容再提交。'}
   else if(!e.status||e.status>=500){showConnection('本次保存结果尚未确认，请恢复连接后重试相同操作。');e.message='保存结果未确认；请重试相同操作（保留幂等编号）。'}
   syncStatus('保存未完成');throw e;
 }finally{busy=false}
}

async function bootAccount(){
 try{
  const response=await fetch('/api/auth/me',{signal:AbortSignal.timeout(15000)}),result=await response.json();
  if(!response.ok){const error=new Error(typeof result.detail==='string'?result.detail:'登录状态检查失败');error.status=response.status;throw error}
  if(!currentUser)await loginAccount(result);
 }catch(e){
  if(currentUser)return;
  const form=document.querySelector('#account-auth-form');
  if(!form)showLogin('login',e.status===401?'':e.message);
  else if(e.status!==401){const notice=document.querySelector('#account-auth-error');if(notice)notice.textContent=e.message}
 }finally{document.documentElement.dataset.accountBoot='complete'}
}

   if(form.dataset.mode==='register'&&v.password!==v.confirm)throw Error('两次密码不一致');
   const result=await request('/api/auth/'+(form.dataset.mode==='register'?'register':'login'),{method:'POST',body:JSON.stringify({username:v.username,password:v.password,displayName:v.displayName||''})});await loginAccount(result);
  }
  if(form.id==='account-profile-form'){const updated=await request('/api/account',{method:'PATCH',body:JSON.stringify({displayName:v.displayName})});Object.assign(currentUser,updated);render();renderAccountPage();toast('账号资料已保存')}
  if(form.id==='account-password-form'){if(v.newPassword!==v.confirmPassword)throw Error('两次新密码不一致');await request('/api/account/password',{method:'POST',body:JSON.stringify({oldPassword:v.oldPassword,newPassword:v.newPassword})});await logoutAccount();toast('密码已修改，请重新登录')}
  if(form.id==='account-access-form'){
   const result=await request('/api/account/mcp-access',{method:'POST',body:JSON.stringify({name:v.name,scope:v.scope})});closeDialog();accountTabs.connections='list';await openAccountPanel('connections');showIssuedConfig({...result.item,url:result.url},result.token);
  }
  if(form.id==='account-oauth-form')await completeConsent(true,v.scope);
 }catch(e){if(error)error.textContent=e.message;else toast(e.message)}finally{if(button)button.disabled=false}
});

let accountDraft='';
function accountFormSnapshot(){return JSON.stringify([...document.querySelectorAll('#account-modal form')].map(f=>[f.id,[...new FormData(f)]]))}
function accountHasDraft(){return document.querySelector('#account-modal')?.open&&accountDraft!==accountFormSnapshot()}
function allowAccountDiscard(){return !accountHasDraft()||confirm('有未保存的修改。确定放弃吗？取消可继续编辑。')}
function closeAccountPanel(){
 const modal=document.querySelector('#account-modal');modal?.close();
 const restore=()=>[...document.querySelectorAll('.account-pill')].find(x=>x.getClientRects().length&&getComputedStyle(x).visibility!=='hidden')?.focus({preventScroll:true});
 restore();requestAnimationFrame(()=>{if(!modal?.open&&!document.querySelector('dialog[open]'))restore()});
};
// Handle Escape deterministically after tab DOM replacement and nested-dialog closure.
document.addEventListener('keydown',e=>{const modal=document.querySelector('#account-modal');if(e.key!=='Escape'||!modal?.open||document.querySelector('#modal')?.open)return;e.preventDefault();e.stopPropagation();if(allowAccountDiscard())closeAccountPanel()},true);
const accountRenderPage=renderAccountPage;
renderAccountPage=function(){
 accountRenderPage();
 const connection=currentUser.connection;
 if(accountPanelView==='connections'&&connection?.oauthAvailable===false){
  const panel=document.querySelector('#account-tabpanel');
  if(accountTabs.connections==='client')panel.innerHTML=`<section class="panel account-card"><h2>使用访问令牌连接</h2><p>当前为HTTP地址，请生成专属配置后导入AI客户端。个人电脑和服务器都可以使用。</p><div class="access-flow">生成令牌 <span>→</span> 下载配置 <span>→</span> 客户端连接</div>${accountButton('前往生成令牌','account-tab','server','primary')}<p class="account-muted">标准OAuth登录授权需要HTTPS。</p></section>`;
  const note=document.querySelector('#account-app .access-preview-note');
  if(note)note.textContent='当前为HTTP连接，令牌和数据未经加密；接入仍受账号权限与撤销控制。';
 }
 accountDraft=accountFormSnapshot();const modal=document.querySelector('#account-modal');if(modal&&!modal.dataset.cancelGuard){modal.dataset.cancelGuard='true';modal.addEventListener('cancel',e=>{e.preventDefault();if(allowAccountDiscard())closeAccountPanel()})}
};
document.addEventListener('click',e=>{const button=e.target.closest('[data-account-action]');if(button&&['close-account-panel','account-tab'].includes(button.dataset.accountAction)&&accountHasDraft()&&!allowAccountDiscard()){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('keydown',e=>{if(!e.target.matches('#account-modal [role=tab]')||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('#account-modal [role=tab]')],i=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;e.preventDefault();tabs[next].click();document.querySelector('#account-modal [role=tab][aria-selected=true]')?.focus()});

/* Production AI onboarding: all device and authorization evidence comes from the server. */
let aiCatalog=null,aiRuntime='auto',aiExpanded=false,aiCopyStatus='',aiIssued=null;
const aiButton=(label,action,id='',cls='secondary')=>`<button type="button" class="${cls}" data-event-id="EVT-AI-CONNECT" data-ai-action="${action}" data-id="${esc(id)}">${label}</button>`;
function aiRuntimeSelect(id){return `<select id="${id}" aria-label="选择AI工具"><option value="auto">自动识别</option>${(aiCatalog?.runtimes||[]).map(x=>`<option value="${x.id}" ${aiRuntime===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}
function aiPrompt(){return `请帮我把${aiRuntime==='auto'?'当前 AI 工具':aiCatalog.runtimes.find(x=>x.id===aiRuntime)?.name||'当前 AI 工具'}接入拾序，用于查询和记录问题。\n读取 ${aiCatalog.guide} 和同源版本清单，识别实际运行环境和版本，按对应适配说明安装或更新已校验的拾序问题记录 Skill；已接入时先比较当前清单与已安装版本，仅更新拾序配置，合并配置远程 MCP：${aiCatalog.mcp}，保留其他连接与用户修改。\n优先原生远程连接，不要求拾序源码或开发环境。需要登录时由我在拾序网页完成并确认权限；不要读取或回显密码、长期令牌和客户端凭据。需要重载或新会话时保留非秘密进度并明确说明。\n完成后调用 get_connection_context 核对账号与权限，再读取问题列表，另行确认 Skill 可发现。分别报告配置、授权、runtime加载、工具调用和Skill状态；不支持时说明卡在哪一步。此次授权检查并更新拾序 Skill 与 MCP 配置，再只读验证，不创建测试问题。以后要求更新或修复接入时，读取最新清单和 /connect/updates.md，检查差异后备份、更新、重载并回读；无法连接旧MCP时仍从公开清单恢复。以后我要求记录问题时，按 Skill 分类、记录真实人员/工具/模型，保存并回读。`}
function aiQuick(){return `<section class="ai-quick"><div class="ai-intro"><span class="ai-mark">↗</span><div><h3>让 AI 帮你接好拾序。</h3><p>复制一段话，交给你正在使用的 AI。<br>配置完成后，直接说“帮我记录一个问题”。</p></div></div><label class="account-field ai-runtime-field"><span>你使用的 AI 工具</span>${aiRuntimeSelect('ai-runtime')}</label><p class="ai-runtime-hint">AI 会检查当前工具能否自动配置。需要你操作的步骤会单独提示。</p><div class="ai-primary-actions">${aiButton('复制给 AI','copy-prompt','','primary')}<a class="secondary" href="/connect" target="_blank" rel="noopener">公开接入指引 ↗</a></div><p id="ai-copy-status" role="status">${esc(aiCopyStatus)}</p><ol class="ai-steps"><li>复制提示词</li><li>交给 AI 配置</li><li>本人登录授权</li><li>AI 验证后使用</li></ol><div class="ai-support">${aiButton(aiExpanded?'收起提示词 ↑':'查看完整提示词 ↓','expand','','account-link')}${aiButton('还没有 AI 工具？','install','','account-link')}</div>${aiExpanded?`<label class="account-field"><span>给 AI 的接入说明</span><textarea id="ai-prompt" readonly rows="9">${esc(aiPrompt())}</textarea></label>`:''}<p class="ai-footnote">Skill ${esc(aiCatalog.skill.version)} · 接入默认只做读取验证。你亲自完成登录和授权。</p></section>`}
function aiDate(value){return value?new Date(value*1000).toLocaleString():'尚无记录'}
function aiDevices(){const rows=currentUser.connections||[];return `<section class="ai-devices"><div class="access-list-toolbar"><span>${rows.length} 个接入记录</span>${aiButton('刷新状态','refresh')}</div>${rows.length?rows.map(x=>`<article class="ai-device-card"><div class="ai-device-head"><div><h3>${esc(x.name)}</h3><p>${x.method==='oauth'?'登录授权':'访问令牌'} · ${x.scope==='write'?'读写':'只读'} · ${esc(currentUser.displayName)}</p></div><span class="status-tag">${x.revoked?'已撤销':!x.enabled?'已过期':x.verifiedAt?'MCP 已验证':'已授权 · 待验证'}</span></div><dl class="ai-device-meta"><div><dt>授权时间</dt><dd>${aiDate(x.createdAt)}</dd></div><div><dt>最近访问</dt><dd>${aiDate(x.lastSeenAt)}</dd></div><div><dt>MCP 验证</dt><dd>${aiDate(x.verifiedAt)}</dd></div><div><dt>授权到期</dt><dd>${aiDate(x.expiresAt)}</dd></div></dl>${x.runtimeName?`<p class="ai-footnote">客户端自报：${esc(x.runtimeName)} ${esc(x.runtimeVersion||'')} · Skill ${esc(x.skillVersion||'未报告')}</p>`:''}<div class="ai-device-actions">${aiButton('重命名','rename',x.id)}${x.enabled?accountButton('撤销接入','revoke-access',x.id,'secondary'):''}</div></article>`).join(''):'<div class="ai-empty"><h3>还没有连接设备</h3><p>先复制提示词交给 AI，完成授权后在这里查看。</p>'+aiButton('前往快速接入','quick','','primary')+'</div>'}<p class="ai-footnote">最近访问不代表在线。MCP 验证仅证明工具调用；客户端与 Skill 版本为自报，Skill 是否加载需在客户端确认。</p></section>`}
function aiManual(){return `<section class="ai-manual"><h3>按客户端能力连接</h3><p>优先使用登录授权；服务器或不兼容的客户端可使用独立访问令牌。</p><label class="account-field"><span>MCP 地址</span><input readonly value="${esc(aiCatalog.mcp)}"></label><div class="ai-primary-actions">${aiButton('复制地址','copy-url')}${accountButton('查看登录授权方法','oauth-preview')}</div><hr><h3>访问令牌</h3><p>创建后只显示一次，可为每台设备单独撤销。</p><label class="account-field"><span>配置格式</span>${aiRuntimeSelect('ai-config-runtime')}</label>${accountButton('生成访问令牌','new-access','','primary')}<p class="ai-footnote">Codex 提供 TOML；其他格式需按当前客户端验证，不通用套用。</p></section>`}
const aiPreviousRender=renderAccountPage;
renderAccountPage=function(){
 if(accountPanelView!=='connections')return aiPreviousRender();
 const app=document.querySelector('#account-app');if(!aiCatalog){app.innerHTML='<p role="status">正在读取接入信息…</p>';return}
 if(!['quick','list','server'].includes(accountTabs.connections))accountTabs.connections='quick';
 const key=accountTabs.connections;
 app.innerHTML=`<div class="account-tabs ai-tabs" role="tablist" aria-label="AI接入">${[['quick','快速接入'],['list','已连接设备'],['server','手动配置']].map(([id,label])=>`<button role="tab" id="account-tab-${id}" aria-controls="account-tabpanel" aria-selected="${key===id}" tabindex="${key===id?0:-1}" data-event-id="EVT-ACCOUNT" data-account-action="account-tab" data-id="${id}" class="${key===id?'active':''}">${label}</button>`).join('')}</div><div id="account-tabpanel" role="tabpanel" aria-labelledby="account-tab-${key}">${key==='quick'?aiQuick():key==='list'?aiDevices():aiManual()}</div>`;
 accountDraft=accountFormSnapshot();const modal=document.querySelector('#account-modal');if(!modal.dataset.cancelGuard){modal.dataset.cancelGuard='true';modal.addEventListener('cancel',e=>{e.preventDefault();if(allowAccountDiscard())closeAccountPanel()})}
};
const aiPreviousOpen=openAccountPanel;
openAccountPanel=async function(kind){if(kind==='connections')aiCatalog=await request('/connect/manifest.json');return aiPreviousOpen(kind)};
showIssuedConfig=function(connection,token){
 const codex=aiRuntime==='codex';
 const text=codex?`[mcp_servers.shixu]\nurl = ${JSON.stringify(connection.url)}\nbearer_token_env_var = "SHIXU_MCP_TOKEN"\n\n# 仅在本机私有环境中设置（不要提交或粘贴到聊天）：\n# SHIXU_MCP_TOKEN = ${JSON.stringify(token)}`:JSON.stringify({mcpServers:{shixu:{type:'http',url:connection.url,headers:{Authorization:'Bearer '+token}}}},null,2);
 aiIssued={text,owner:currentUser.id,extension:codex?'toml':'json'};
 show('保存专属配置',`<p>${esc(connection.name)} · 仅访问 ${esc(currentUser.displayName)} 的工作台</p><p>令牌仅此次显示，请保存到设备私有位置。</p><textarea id="issued-config" rows="10" readonly>${esc(text)}</textarea><p class="ai-footnote">${codex?'按注释在本机设置私有环境变量。':'此为远程 HTTP JSON 模板，请核对目标客户端支持的字段。'}</p><div class="modal-actions">${aiButton('复制配置','copy-issued','','primary')}${aiButton('下载配置','download-issued')}${btn('完成','close')}</div>`);
};
async function aiCopy(text,field){try{await navigator.clipboard.writeText(text);return true}catch{field?.focus();field?.select();return false}}
document.addEventListener('change',e=>{if(['ai-runtime','ai-config-runtime'].includes(e.target.id)){aiRuntime=e.target.value;aiCopyStatus='';renderAccountPage();document.getElementById(e.target.id)?.focus()}});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-ai-action]');if(!b)return;e.preventDefault();const a=b.dataset.aiAction;b.disabled=true;
 try{
  if(a==='expand'){aiExpanded=!aiExpanded;renderAccountPage()}
  if(a==='quick'){accountTabs.connections='quick';renderAccountPage()}
  if(a==='copy-prompt'){aiExpanded=true;renderAccountPage();const ok=await aiCopy(aiPrompt(),document.querySelector('#ai-prompt'));aiCopyStatus=ok?'已复制。粘贴到 AI 对话中继续。':'未获得剪贴板权限，请手动复制已选中的提示词。';document.querySelector('#ai-copy-status').textContent=aiCopyStatus}
  if(a==='copy-url')toast(await aiCopy(aiCatalog.mcp,document.querySelector('#account-tabpanel input'))?'地址已复制':'请手动复制地址');
  if(a==='refresh')await openAccountPanel('connections');
  if(a==='install')show('准备 AI 工具',`<p>先安装能执行本地操作的 AI 客户端，然后回来复制提示词。</p><div class="ai-install-options">${aiCatalog.runtimes.filter(x=>x.install).map(x=>`<a class="secondary" href="${esc(x.install)}" target="_blank" rel="noopener">${esc(x.name)} 官方入口 ↗</a>`).join('')}</div><p>已有客户端但只能聊天时，按手动配置完成导入。运行环境兼容范围以公开指引为准。</p>`);
  if(a==='rename'){const row=currentUser.connections.find(x=>x.id===b.dataset.id);show('重命名设备',`<form id="ai-rename-form" data-id="${esc(row.id)}">${accountField('设备名称',accountInput('name','text',row.name,'','required maxlength="60"'))}<p class="account-error" role="alert"></p><div class="modal-actions"><button type="submit" class="primary">保存</button>${btn('取消','close')}</div></form>`)}
  if(['copy-issued','download-issued'].includes(a)&&aiIssued?.owner===currentUser.id){if(a==='copy-issued')toast(await aiCopy(aiIssued.text,document.querySelector('#issued-config'))?'配置已复制':'请手动复制配置');else{const url=URL.createObjectURL(new Blob([aiIssued.text],{type:'text/plain'})),link=document.createElement('a');link.href=url;link.download='shixu-private.'+aiIssued.extension;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
 }catch(error){toast(error.message)}finally{b.disabled=false}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='ai-rename-form')return;e.preventDefault();const f=e.target,button=f.querySelector('[type=submit]');button.disabled=true;try{await request('/api/account/mcp-access/'+encodeURIComponent(f.dataset.id),{method:'PATCH',body:JSON.stringify({displayName:new FormData(f).get('name')})});closeDialog();await openAccountPanel('connections');toast('设备名称已更新')}catch(error){f.querySelector('.account-error').textContent=error.message}finally{button.disabled=false}});
document.querySelector('#modal')?.addEventListener('close',()=>{if(document.querySelector('#modal')?.open)return;aiIssued=null;const field=document.querySelector('#issued-config');if(field)field.value=''});
