function segRect(s,b,pad=0){if(s.horizontal)return s.a.y>b.y-pad+.01&&s.a.y<b.y+b.h+pad-.01&&Math.max(s.a.x,s.b.x)>b.x-pad+.01&&Math.min(s.a.x,s.b.x)<b.x+b.w+pad-.01;return s.a.x>b.x-pad+.01&&s.a.x<b.x+b.w+pad-.01&&Math.max(s.a.y,s.b.y)>b.y-pad+.01&&Math.min(s.a.y,s.b.y)<b.y+b.h+pad-.01}
function cross(a,b){const between=(v,x,y)=>v>=Math.min(x,y)-.01&&v<=Math.max(x,y)+.01;if(a.horizontal===b.horizontal){if(a.horizontal)return Math.abs(a.a.y-b.a.y)<.01&&Math.max(Math.min(a.a.x,a.b.x),Math.min(b.a.x,b.b.x))<=Math.min(Math.max(a.a.x,a.b.x),Math.max(b.a.x,b.b.x))+.01;return Math.abs(a.a.x-b.a.x)<.01&&Math.max(Math.min(a.a.y,a.b.y),Math.min(b.a.y,b.b.y))<=Math.min(Math.max(a.a.y,a.b.y),Math.max(b.a.y,b.b.y))+.01}const h=a.horizontal?a:b,v=a.horizontal?b:a;return between(v.a.x,h.a.x,h.b.x)&&between(h.a.y,v.a.y,v.b.y)}
function validate(){let errors=[],crossings=0,intrusions=0,labelOverlaps=0;const tables=MODEL.tables.filter(t=>!hidden.has(t.id));

 for(const e of rendered){const segs=segments(e.pts);if(segs.some(s=>s.a.x!==s.b.x&&s.a.y!==s.b.y))errors.push(e.id+' 非正交');
 for(const [end,p,index]of [['s',e.pts[0],0],['t',e.pts.at(-1),segs.length-1]]){const q=port(e,end),n=norm(q.side),other=end==='s'?e.pts[1]:e.pts.at(-2);if(p.x!==q.x||p.y!==q.y||((other.x-p.x)*n.x+(other.y-p.y)*n.y)<36||((other.x-p.x)*n.y-(other.y-p.y)*n.x)!==0)errors.push(e.id+' 端口方向/距离');}

 for(const t of tables)if(overlap(e.label.rect,box(t.id),4)){labelOverlaps++;errors.push(e.id+' 标签覆盖实体')}
 for(const other of rendered){if(e.id===other.id)continue;if(segments(other.pts).some(s=>segRect(s,e.label.rect,4))){labelOverlaps++;errors.push(e.id+' 标签覆盖其他线') }}
 }
 for(let i=0;i<rendered.length;i++)for(let j=i+1;j<rendered.length;j++){const a=rendered[i],b=rendered[j];for(const s of segments(a.pts))for(const t of segments(b.pts))if(cross(s,t)){crossings++;errors.push(a.id+' × '+b.id)}if(overlap(a.label.rect,b.label.rect,4)){labelOverlaps++;errors.push(a.id+' 标签重叠 '+b.id)}}

 return{ok:!errors.length&&unique&&integrity&&crowfeet,errors,crossings,intrusions,labelOverlaps,unique,integrity,crowfeet,tables:tables.length,relations:rendered.length};
}
function writeContract(r){if(r.ok){if(visible)checked.shown=true;else checked.hidden=true}const attrs={'geometry-status':r.ok,'entity-uniqueness-status':r.unique,'relation-integrity-status':r.integrity,'crowfoot-status':r.crowfeet,'label-anchor-status':!r.errors.some(e=>e.includes('锚定')),'label-clearance-status':!r.errors.some(e=>e.includes('净空')),'label-overlap-status':r.labelOverlaps===0,'fields-visible-status':checked.shown,'fields-hidden-status':checked.hidden};for(const[k,v]of Object.entries(attrs))root.setAttribute('data-'+k,v?'pass':'fail');for(const[k,v]of Object.entries({crossings:r.crossings,'label-overlaps':r.labelOverlaps,'path-entity-intrusions':r.intrusions,tables:r.tables,relations:r.relations}))root.setAttribute('data-'+k,v);}
