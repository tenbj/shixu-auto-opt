name: 验证拾序系统
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 定位系统目录
        shell: pwsh
        run: |
          if (Test-Path application/requirements-dev.txt) { 'SYSTEM_DIR=application' >> $env:GITHUB_ENV } else { 'SYSTEM_DIR=.' >> $env:GITHUB_ENV }
      - run: python -m pip install -r requirements-dev.txt
        working-directory: ${{ env.SYSTEM_DIR }}
      - run: python -m playwright install chromium
        working-directory: ${{ env.SYSTEM_DIR }}
      - run: python tests/run_suite.py
        working-directory: ${{ env.SYSTEM_DIR }}
      - run: python scripts/generate_docs.py
        working-directory: ${{ env.SYSTEM_DIR }}
      - run: python scripts/generate_diagrams.py
        working-directory: ${{ env.SYSTEM_DIR }}
      - run: python tests/diagrams_check.py
        working-directory: ${{ env.SYSTEM_DIR }}
      - run: python tests/checkout_check.py
        working-directory: ${{ env.SYSTEM_DIR }}
      - run: python scripts/build_release.py --ci
        working-directory: ${{ env.SYSTEM_DIR }}
