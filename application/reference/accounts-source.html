</style></head><body><aside><div class="brand"><div class="logo">⌁</div><div><b>拾序</b><small>A LITTLE MORE CLARITY</small></div></div><div class="nav-label">我的空间 / PERSONAL</div><nav id="nav"></nav><div class="sidebar-bottom"><b>让每个困扰，都有下一步。</b><p style="font-size:11px;margin-top:10px">个人工作台 · 本地体验版<br>数据仅保存在当前浏览器</p></div></aside><main><div class="topbar"><span>我的空间 <span style="margin:0 12px;color:#bcc6b2">/</span><span id="breadcrumb">今日概览</span></span><div class="topbar-right"><button data-event-id="EVT-ACTION" data-action="workflow-guide" class="subtle">状态流转</button><button data-event-id="EVT-ACTION" data-action="export" class="subtle">↓ 导出记录</button><div id="desktop-identity"></div></div></div><div id="storage-warning" class="banner hidden" role="alert"></div><div id="app" aria-live="polite">正在整理你的工作台…</div><div class="prototype-note">账号与授权交互原型 · 独立工作台体验，未连接真实服务。</div></main><dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button data-event-id="EVT-ACTION" data-action="close" aria-label="关闭弹窗">✕</button></div><div id="modal-content" class="modal-body"></div></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const ACCOUNT_KEY='shixu-account-preview-v1',SESSION_KEY=ACCOUNT_KEY+'-session',WORKSPACE_KEY=ACCOUNT_KEY+'-workspace:';
let accountModel;try{accountModel=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||'null')}catch{}
if(!accountModel||!Array.isArray(accountModel.users))accountModel={version:1,users:[{id:'test',username:'test',displayName:'test',password:'DEMO_PASSWORD',connections:[]}]};
for(const u of accountModel.users)if(!Array.isArray(u.connections))u.connections=[];
let signedInId=sessionStorage.getItem(SESSION_KEY);if(!accountModel.users.some(x=>x.id===signedInId))signedInId=null;
let lastPreviewConfig=null;
try{const target=WORKSPACE_KEY+'test',legacy='shixu-creator-prototype-v2';if(!localStorage.getItem(target)&&localStorage.getItem(legacy))localStorage.setItem(target,localStorage.getItem(legacy));if(!localStorage.getItem(target+'-profiles')&&localStorage.getItem(legacy+'-profiles'))localStorage.setItem(target+'-profiles',localStorage.getItem(legacy+'-profiles'));localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accountModel))}catch{}
let KEY=WORKSPACE_KEY+(signedInId||'test');
const $=s=>activeDialog()?.querySelector(s)||document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=d=>{const x=new Date();x.setDate(x.getDate()+d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},today=date(0),uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`;

const TOOLS={manual:'手动',claude_code:'Claude Code',workbuddy:'WorkBuddy',codex:'Codex',deepseek_harness:'DeepSeek Harness',unknown:'未知来源'};
function restoreCustomTools(items,registry={}){for(const key of Object.keys(TOOLS))if(key.startsWith('custom:'))delete TOOLS[key];for(const [id,name] of Object.entries(registry))if(id.startsWith('custom:')&&typeof name==='string'&&name.trim())TOOLS[id]=name.trim();for(const x of items||[])if(typeof x.via==='string'&&x.via.startsWith('custom:')&&typeof x.toolName==='string'&&x.toolName.trim())TOOLS[x.via]=x.toolName.trim()}
function syncCustomToolField(f){const box=f.querySelector('.custom-tool-field'),input=f.elements.profileCustomTool,on=f.elements.profileKind.value==='agent'&&f.elements.profileVia.value==='__custom__';box.classList.toggle('hidden',!on);input.disabled=!on;input.required=on}
const defaultProfile={id:'agent:codex',name:'Codex',kind:'agent',via:'codex',modelName:'GPT-6',modelProvider:'OpenAI'};
let profiles=[{...defaultProfile}],activeProfileId=defaultProfile.id;
try{const pref=JSON.parse(localStorage.getItem(KEY+'-profiles')||'null');if(pref&&Array.isArray(pref.items)&&pref.items.length){restoreCustomTools(pref.items,pref.customTools);const valid=pref.items.filter(x=>typeof x.id==='string'&&typeof x.name==='string'&&x.name.trim()&&['person','agent'].includes(x.kind)&&Object.hasOwn(TOOLS,x.via));if(valid.length){profiles=valid;activeProfileId=valid.some(x=>x.id===pref.active)?pref.active:valid[0].id}}}catch{}
const currentProfile=()=>profiles.find(p=>p.id===activeProfileId)||profiles[0];
const creatorFilters={issues:{person:'',via:''},tasks:{person:'',via:''}};
function persistProfiles(){try{localStorage.setItem(KEY+'-profiles',JSON.stringify({items:profiles,active:activeProfileId,customTools:Object.fromEntries(Object.entries(TOOLS).filter(([id])=>id.startsWith('custom:')))}));return true}catch{toast('记录身份尚未保存，刷新后请重新设置');return false}}
function identitySwitch(cls){return `<button class="identity-switch ${cls} identity-button" data-event-id="EVT-ACTION" data-action="identity-settings" aria-label="记录身份"><span>记录身份</span><strong>${esc(currentProfile().name)}</strong><span aria-hidden="true">⌄</span></button>`}
function identitySettings(){show('记录身份',`<p class="identity-explain">为人或 AI 设置记录身份，新记录会自动带入。名称可自定义，已有记录保留原始信息。</p><div class="identity-list">${profiles.map(p=>`<div class="identity-item">${btn(`<strong>${esc(p.name)}</strong><small>${p.kind==='agent'?esc(TOOLS[p.via])+' · '+esc(p.modelName||'模型未提供'):'个人身份'}</small>${p.id===activeProfileId?'<span>当前使用</span>':''}`,'use-profile',p.id,'profile-choice '+(p.id===activeProfileId?'selected':''))}${btn('编辑','edit-profile',p.id,'subtle')}</div>`).join('')}</div><div class="modal-actions">${btn('＋ 添加身份','add-profile','','primary')}${btn('返回','close')}</div>`)}
function profileForm(id){const x=profiles.find(p=>p.id===id);show(x?'编辑记录身份':'添加记录身份',`<form id="profile-form" data-event-id="EVT-SUBMIT" data-id="${esc(id||'')}">${field('身份名称',`<input name="profileName" data-event-id="EVT-FIELD" required maxlength="60" value="${esc(x?.name||'')}" placeholder="例如：姓名、昵称或AI助手名称">`)}${field('身份类型',`<select name="profileKind" data-event-id="EVT-IDENTITY"><option value="person" ${x?.kind==='agent'?'':'selected'}>人</option><option value="agent" ${x?.kind==='agent'?'selected':''}>AI</option></select>`)}<div class="profile-ai-fields ${x?.kind==='agent'?'':'hidden'}">${field('AI 工具',`<select name="profileVia" data-event-id="EVT-FIELD">${Object.entries(TOOLS).filter(([id])=>!['manual','unknown'].includes(id)).map(([id,name])=>`<option value="${esc(id)}" ${(x?.via||'codex')===id?'selected':''}>${esc(name)}</option>`).join('')}<option value="__custom__">＋ 其他 / 自定义工具</option></select>`)}<div class="custom-tool-field hidden">${field('自定义工具名称',`<input name="profileCustomTool" data-event-id="EVT-FIELD" maxlength="80" disabled placeholder="例如：Cursor、Gemini CLI 或其他工具">`)}<p class="muted">保存后加入工具列表，下次可直接选择。</p></div>${field('模型名称 / ID · 选填',`<input name="profileModel" data-event-id="EVT-FIELD" maxlength="160" value="${esc(x?.modelName||'')}" placeholder="模型实际名称或标识">`)}${field('模型提供方 · 选填',`<input name="profileProvider" data-event-id="EVT-FIELD" maxlength="80" value="${esc(x?.modelProvider||'')}" placeholder="例如：OpenAI">`)}</div><div id="form-error" class="error" role="alert"></div><div class="modal-actions">${btn('返回','identity-settings')}<button type="submit" data-event-id="EVT-SUBMIT" class="primary">保存并使用</button></div></form>`)}
function creationPerson(r){return r.initiatedByPersonId||r.createdByActorId||'unknown'}
function creatorName(r){return r.creatorName||profiles.find(p=>p.id===creationPerson(r))?.name||(!['manual','unknown'].includes(r.createdVia)?TOOLS[r.createdVia]:'未知')}
function creatorLine(r){const via=r.createdVia||'unknown',name=creatorName(r),sameTool=!r.initiatedByPersonId&&name===TOOLS[via];return `<div class="creator-line" data-creator-person="${esc(creationPerson(r))}" data-creator-via="${esc(via)}"><span class="creator-person">${esc(name)}</span>${via==='unknown'?'<span class="creator-tool">来源未知</span>':via==='manual'?'<span class="creator-tool">创建</span>':sameTool?'':`<span class="creator-tool">经 ${esc(TOOLS[via])} 创建</span>`}${!['manual','unknown'].includes(via)?`<span class="creator-model">· ${esc(r.modelInfo?.name||'模型未提供')}</span>`:''}</div>`}
function creationDetail(r){return `<section class="creation-detail" aria-label="创建信息"><div><span>创建人</span>${esc(creatorName(r))}</div><div><span>创建来源</span>${esc(TOOLS[r.createdVia]||'未知来源')}</div><div><span>创建时间</span>${r.createdAt?esc(new Date(r.createdAt).toLocaleString('zh-CN')):'未记录'}</div>${!['manual','unknown'].includes(r.createdVia)?`<div><span>模型名称 / ID</span>${esc(r.modelInfo?.name||'模型未提供')}</div><div><span>模型提供方</span>${esc(r.modelInfo?.provider||'未提供')}</div>`:''}</section>`}
function creationFields(obj){if(obj)return creationDetail(obj);const c=currentProfile(),human=profiles.filter(x=>x.kind==='person'),via=c.kind==='person'?'manual':c.via;return `<details class="creation-config"><summary>创建信息 · ${esc(c.name)}${c.kind==='agent'?' · '+esc(c.modelName||'模型未提供'):''}</summary><div class="grid2">${field('人类发起者 · 选填',`<select name="creationPerson" data-event-id="EVT-CREATION">${human.map(x=>`<option value="${esc(x.id)}" ${c.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="ai" ${c.kind==='agent'?'selected':''} ${via==='manual'?'disabled':''}>未指定人类发起者</option></select>`)}${field('创建来源',`<select name="creationVia" data-event-id="EVT-CREATION">${Object.entries(TOOLS).filter(([id])=>id!=='unknown').map(([id,name])=>`<option value="${esc(id)}" ${via===id?'selected':''} ${id==='manual'&&!human.length?'disabled':''}>${esc(name)}</option>`).join('')}</select>`)}</div><div class="grid2 model-fields ${via==='manual'?'hidden':''}">${field('模型名称 / ID · 选填',`<input name="modelName" data-event-id="EVT-FIELD" maxlength="160" value="${esc(c.kind==='agent'?c.modelName||'':'')}" placeholder="填写工具实际返回的模型标识">`)}${field('模型提供方 · 选填',`<input name="modelProvider" data-event-id="EVT-FIELD" maxlength="80" value="${esc(c.kind==='agent'?c.modelProvider||'':'')}" placeholder="例如 OpenAI、Anthropic、DeepSeek">`)}</div><p>自动带入当前记录身份；需要代录时可指定人类发起者。</p></details>`}
function creationValues(v){const c=currentProfile(),via=v.creationVia||(c.kind==='person'?'manual':c.via),person=v.creationPerson||(c.kind==='person'?c.id:'ai'),human=profiles.find(x=>x.id===person&&x.kind==='person'),actor=via==='manual'?person:c.kind==='agent'&&c.via===via?c.id:'agent:'+via;return {initiatedByPersonId:human?.id||null,createdByActorId:actor,creatorName:human?.name||(actor===c.id?c.name:TOOLS[via]),createdVia:via,createdAt:new Date().toISOString(),modelInfo:via==='manual'?null:{name:String(v.modelName??(c.kind==='agent'&&c.via===via?c.modelName:'')??'').trim(),provider:String(v.modelProvider??(c.kind==='agent'&&c.via===via?c.modelProvider:'')??'').trim()}}}
function matchesCreator(r,kind){const f=creatorFilters[kind];return (!f.person||creationPerson(r)===f.person)&&(!f.via||r.createdVia===f.via)}
function creatorFilterBar(kind){const f=creatorFilters[kind],rows=kind==='issues'?db.issues:db.tasks,names=new Map(rows.map(r=>[creationPerson(r),creatorName(r)]));return `<div class="creator-filters" aria-label="创建信息筛选"><label>创建人<select data-event-id="EVT-CREATOR-FILTER" data-kind="${kind}" data-filter="person" aria-label="按创建人筛选"><option value="">全部创建人</option>${[...names].map(([id,n])=>`<option value="${esc(id)}" ${id===f.person?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>创建来源<select data-event-id="EVT-CREATOR-FILTER" data-kind="${kind}" data-filter="via" aria-label="按创建来源筛选"><option value="">全部来源</option>${Object.entries(TOOLS).map(([id,n])=>`<option value="${id}" ${id===f.via?'selected':''}>${n}</option>`).join('')}</select></label>${f.person||f.via?btn('清除创建筛选','clear-creator-filter',kind,'subtle'):''}</div>`}
function normalizeCreation(r){r.createdByActorId=typeof r.createdByActorId==='string'?r.createdByActorId:null;r.initiatedByPersonId=typeof r.initiatedByPersonId==='string'?r.initiatedByPersonId:null;r.creatorName=typeof r.creatorName==='string'?r.creatorName:null;r.createdVia=Object.hasOwn(TOOLS,r.createdVia)?r.createdVia:'unknown';r.createdAt=typeof r.createdAt==='string'&&Number.isFinite(Date.parse(r.createdAt))?r.createdAt:null;r.modelInfo=!['manual','unknown'].includes(r.createdVia)&&r.modelInfo&&typeof r.modelInfo==='object'?{name:String(r.modelInfo.name||'').slice(0,160),provider:String(r.modelInfo.provider||'').slice(0,80)}:null}
document.addEventListener('change',e=>{const el=e.target;if(el.name==='profileKind'){el.closest('form').querySelector('.profile-ai-fields').classList.toggle('hidden',el.value!=='agent');syncCustomToolField(el.closest('form'))}if(el.name==='profileVia')syncCustomToolField(el.closest('form'));if(el.dataset.eventId==='EVT-CREATOR-FILTER'){creatorFilters[el.dataset.kind][el.dataset.filter]=el.value;render()}if(el.dataset.eventId==='EVT-CREATION'){const f=el.closest('form'),via=f.elements.creationVia.value,person=f.elements.creationPerson;f.querySelector('.model-fields').classList.toggle('hidden',via==='manual');person.querySelector('[value="ai"]').disabled=via==='manual';if(via==='manual'&&person.value==='ai')person.value=profiles.find(x=>x.kind==='person')?.id||'';f.querySelector('summary').textContent='创建信息 · '+(profiles.find(x=>x.id===person.value)?.name||TOOLS[via])}}
);

function dependencyError(tasks,id,deps){
  const current=tasks.find(t=>t.id===id);if(!current)return '行动不存在。';
  if(deps.some(d=>d===id))return '行动不能依赖自己。';
  if(deps.some(d=>!tasks.some(t=>t.id===d&&t.issueId===current.issueId)))return '前置行动必须来自同一个问题。';
  const visiting=new Set(),visited=new Set();
  function visit(key){if(visiting.has(key))return true;if(visited.has(key))return false;visiting.add(key);const ds=key===id?deps:tasks.find(t=>t.id===key)?.dependsOn||[];if(ds.some(visit))return true;visiting.delete(key);visited.add(key);return false}
  return tasks.some(t=>visit(t.id))?'这些依赖形成循环，请调整前置行动。':'';
}
function blockedBy(t){return (t.dependsOn||[]).map(id=>db.tasks.find(x=>x.id===id)).filter(x=>!x||x.status!=='已完成')}
function hasStartedDependents(t){return db.tasks.some(x=>(x.dependsOn||[]).includes(t.id)&&['进行中','已完成'].includes(x.status))}
function setTaskDependencies(id,deps){
  const t=db.tasks.find(x=>x.id===id),error=dependencyError(db.tasks,id,deps);if(error)return error;
  if(['进行中','已完成'].includes(t.status)&&deps.some(id=>db.tasks.find(x=>x.id===id)?.status!=='已完成'))return '先将当前行动退回待办，再增加尚未完成的前置行动。';
  t.dependsOn=[...new Set(deps)];log(issue(t.issueId),'更新行动前置依赖：'+t.title);return '';
}

}
function reorderTask(id,targetId,after=false){
  const t=db.tasks.find(x=>x.id===id),target=db.tasks.find(x=>x.id===targetId);if(!t||!target||t===target||t.issueId!==target.issueId)return false;
  const group=db.tasks.filter(x=>x.issueId===t.issueId).sort((a,b)=>a.order-b.order),old=group.indexOf(t);group.splice(old,1);const at=group.indexOf(target)+(after?1:0);group.splice(at,0,t);group.forEach((x,i)=>x.order=i);return true;
}

function transitionIssue(p,action,v){
  const allowed={triage:['待梳理'],start:['待处理'],verify:['待梳理','待处理','处理中'],resolve:['待验证'],reject:['待验证'],pause:OPEN_STATES,resume:['已暂缓'],'close-issue':[...OPEN_STATES,'已暂缓'],reopen:['已解决','已关闭'],retriage:['待处理']};
  if(!allowed[action]?.includes(p.status))return '当前状态不允许这个操作，请重新打开详情。';
  const text=k=>String(v[k]||'').trim();
  if(action==='triage'&&(!text('nextStep')||!text('successCriteria')))return '请填写下一步和解决标准。';
  if(action==='start'&&(!p.nextStep.trim()||!p.successCriteria.trim()))return '请先完成梳理。';
  if(action==='verify'){
    if(p.status!=='处理中'&&linked(p.id).length)return '请先开始处理，再提交验证。';
    if(remaining(p.id).length)return '还有未完成的必要行动。';

 const text=codex?`# 原型演示，请勿用于真实接入\n[mcp_servers.shixu]\nurl = "${AI_ENDPOINT}"\nbearer_token_env_var = "SHIXU_MCP_TOKEN"\n\n# 在私有环境变量中配置以下演示令牌：\n# SHIXU_MCP_TOKEN = "${token}"`:JSON.stringify({mcpServers:{shixu:{type:'http',url:AI_ENDPOINT,headers:{Authorization:'Bearer '+token}}}},null,2);
 aiIssued={owner:accountNow().id,text,extension:codex?'toml':'json'};
 show('访问令牌配置预览',`<div class="access-success">✓ ${esc(connection.name)} · ${esc(accountNow().displayName)} 的工作台</div><p>配置仅在本次生成时展示。正式使用时保存在设备私有配置中。</p><label class="account-field"><span>${codex?'Codex · TOML':'远程 MCP · JSON'} 配置</span><textarea id="issued-config" rows="9" readonly data-event-id="EVT-AI-CONNECT">${esc(text)}</textarea></label><p class="ai-footnote">DEMO 令牌仅用于原型演示。请勿粘贴到真实客户端。</p><div class="modal-actions">${aiBtn('复制配置','copy-issued','','primary')}${aiBtn('下载配置','download-issued')}${btn('完成','close')}</div>`);
};
document.addEventListener('change',e=>{if(['ai-runtime','ai-config-runtime'].includes(e.target.id)){aiRuntime=e.target.value;aiCopied=false;aiRefresh();document.getElementById(e.target.id)?.focus()}},true);
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-ai-action]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const action=b.dataset.aiAction;
 if(action==='copy-prompt'){aiExpanded=true;aiRefresh();aiCopied=await aiCopy(aiPrompt(),document.querySelector('#ai-prompt'));aiRefresh();if(!aiCopied){const field=document.querySelector('#ai-prompt');field?.focus();field?.select();document.querySelector('#ai-copy-status').textContent='未获得剪贴板权限，请手动复制已选中的提示词。'}}
 if(action==='toggle-prompt'){aiExpanded=!aiExpanded;aiRefresh()}
 if(action==='copy-url'){if(await aiCopy(AI_ENDPOINT,document.querySelector('.ai-copy-row input')))toast('MCP 地址已复制')}
 if(action==='public-help')aiPublic();
 if(action==='start-demo'){
  if(!accountNow()){closeDialog();showLogin('login','请先登录体验账号。登录后从右上角“AI接入”体验完整流程。');return}
  if(document.querySelector('#ai-public'))closeDialog();aiFlow={stage:'prepare',client:aiClient()};accountTabs.connections='quick';openAccountPanel('connections');
 }
 if(action==='install-help')show('还没有 AI 工具？',`<div class="ai-install"><h3>先准备一个能执行操作的 AI。</h3><p>选择并安装一款 AI 客户端，完成客户端自己的登录。然后回到拾序，复制接入提示词。</p><div class="ai-install-options">${aiBtn('Codex','choose-install','codex')}${aiBtn('WorkBuddy','choose-install','workbuddy')}</div><div id="ai-install-detail" class="ai-note">原型仅演示安装引导，不下载或安装软件。</div><p class="ai-footnote">如果 AI 只能聊天，不能执行本地操作，可以使用“手动配置”导入连接。</p><div class="modal-actions">${btn('返回','close')}</div></div>`);
 if(action==='choose-install')document.querySelector('#ai-install-detail').textContent=`${AI_RUNTIME_NAMES[b.dataset.id]}：正式版将提供官方下载入口。安装并登录后，把“复制给 AI”的内容粘贴到新对话中继续。`;
 if(action==='exit-demo'||action==='quick'){aiFlow=null;accountTabs.connections='quick';renderAccountPage()}
 if(action==='manual'||action==='devices'){accountTabs.connections=action==='manual'?'server':'list';renderAccountPage()}
 if(action==='authorize'||action==='manual-auth')aiConsent();
 if(action==='deny'){closeDialog();aiFlow.stage='denied';accountTabs.connections='quick';renderAccountPage()}
 if(action==='unsupported'||action==='reload'||action==='fail'){aiFlow.stage={unsupported:'unsupported',reload:'reload',fail:'error'}[action];renderAccountPage()}
 if(action==='verify'){
  aiFlow.stage='success';const c=accountNow().connections.find(x=>x.id===aiFlow.connectionId);if(c){c.verifiedAt=new Date().toISOString();storeAccounts()}renderAccountPage();
 }
 if(action==='copy-example'){const ok=await aiCopy('帮我在拾序记录一个问题：每次开会后都忘记整理行动项。');if(ok){b.textContent='✓ 示例已复制';toast('记录示例已复制，本原型未创建问题')}}
 if(action==='rename'){const c=accountNow().connections.find(x=>x.id===b.dataset.id);if(c)show('重命名设备',`<form id="ai-rename-form" data-event-id="EVT-AI-CONNECT" data-id="${esc(c.id)}">${accountField('设备名称',accountInput('name','text',c.name,'','required maxlength="60"'))}<div class="account-error" role="alert"></div><div class="modal-actions">${btn('取消','close')}<button type="submit" class="primary" data-event-id="EVT-AI-CONNECT">保存名称</button></div></form>`)}
 if(['copy-issued','download-issued'].includes(action)&&aiIssued?.owner===accountNow()?.id){if(action==='copy-issued'){if(await aiCopy(aiIssued.text,document.querySelector('#issued-config')))toast('演示配置已复制')}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([aiIssued.text],{type:'text/plain'}));a.download='shixu-demo.'+aiIssued.extension;a.click();URL.revokeObjectURL(a.href);toast('演示配置已下载')}}
},true);
document.addEventListener('submit',e=>{
 const f=e.target;if(!['ai-consent-form','ai-rename-form'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();const data=Object.fromEntries(new FormData(f)),u=accountNow();
 if(f.id==='ai-consent-form'){
  let c=u.connections.find(x=>x.id===aiFlow.connectionId);
  if(c){c.scope=data.scope;c.enabled=true;delete c.verifiedAt}else{c={id:uid(),name:aiFlow.client+' · 本机演示',runtime:aiFlow.client,method:'oauth',scope:data.scope,owner:u.id,enabled:true,createdAt:new Date().toISOString()};u.connections.push(c)}
  if(!storeAccounts()){f.querySelector('.account-error').textContent='保存失败，请重试。';return}aiFlow.connectionId=c.id;aiFlow.scope=data.scope;aiFlow.stage='verify';closeDialog();accountTabs.connections='quick';renderAccountPage();
 }else{const c=u.connections.find(x=>x.id===f.dataset.id),name=String(data.name||'').trim();if(!name){f.querySelector('.account-error').textContent='请输入设备名称。';return}if(c)c.name=name;if(storeAccounts()){closeDialog();renderAccountPage();toast('名称已更新')}}
},true);
let accountSavedDraft='';
const aiDraft=()=>JSON.stringify([...document.querySelectorAll('#account-app form')].map(f=>[f.id,[...new FormData(f)]]));
const originalOpenAccount=openAccountPanel;
openAccountPanel=function(kind){originalOpenAccount(kind);const d=document.querySelector('#account-modal');d.querySelector('h2').textContent=kind==='connections'?'AI接入':'账号设置';accountSavedDraft=aiDraft();if(!d.dataset.aiClose){d.dataset.aiClose='1';d.addEventListener('close',()=>{[...document.querySelectorAll('[data-account-action="toggle-menu"]')].find(x=>x.getBoundingClientRect().width>0)?.focus({preventScroll:true})});d.addEventListener('cancel',e=>{if(aiDraft()!==accountSavedDraft&&!confirm('有未保存的修改。确定放弃吗？'))e.preventDefault()})}};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-account-action]');if(!b)return;
 if(['close-account-panel','account-tab'].includes(b.dataset.accountAction)&&aiDraft()!==accountSavedDraft&&!confirm('有未保存的修改。确定放弃吗？')){e.preventDefault();e.stopImmediatePropagation();return}
 if(b.dataset.accountAction==='connections'){accountTabs.connections='quick';aiFlow=null}
 if(b.dataset.accountAction==='logout'){aiFlow=null;aiIssued=null}
 if(b.dataset.accountAction==='account-tab')queueMicrotask(()=>{accountSavedDraft=aiDraft()});
},true);
document.addEventListener('keydown',e=>{if(!e.target.matches('#account-modal [role=tab]')||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('#account-modal [role=tab]')],i=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;e.preventDefault();tabs[next].click();document.querySelector('#account-modal [role=tab][aria-selected=true]')?.focus()});
queueMicrotask(()=>{const params=new URLSearchParams(location.search);if(params.get('connect')==='1')aiPublic();else if(params.get('panel')==='ai'&&accountNow()){accountTabs.connections='quick';openAccountPanel('connections')}});

// MOBILE-DESIGN-END
if(signedInId)loadAccountWorkspace(accountNow());
else if(numberingMigrated&&!storageBlocked)save();
render();

</script></body></html>
