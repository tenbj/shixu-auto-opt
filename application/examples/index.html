<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾序 API 调用示例</title>
<style>body{font:16px system-ui;max-width:880px;margin:40px auto;padding:20px;background:#f6f8f2;color:#214636}button,input{font:inherit;padding:10px;margin:6px}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:12px}label{display:block}</style>
<h1>拾序 API 调用示例</h1><p>通过同源服务打开。默认只读；写入按钮仅创建新的演示问题，再为该问题提交观察依据。</p>
<button id="load">读取状态与问题列表</button><button id="create">创建一条演示问题</button>
<label>记录身份 <select id="identity"><option value="">未指定（来源未知）</option></select></label>
<label>人类发起者（仅AI代录）<select id="person"><option value="">未指定</option></select></label>
<label>本次模型名称 / ID <input id="model" maxlength="160"></label><label>模型提供方 <input id="provider" maxlength="80"></label>
<p>先读取，身份在系统右上角管理。AI模型可修改或留空；手动身份不会提交模型。</p>
<label>观察与证据 <input id="evidence" maxlength="5000" placeholder="填写实际观察结果"></label><button id="verify" disabled>为本页新建问题提交验证</button><pre id="result" role="status">点击读取开始</pre>
<script>
let created=null,revision=null,profiles=[],pendingCreate=null;
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(r.status+' '+JSON.stringify(v.detail));return v}
async function run(fn){try{document.querySelector('#result').textContent=JSON.stringify(await fn(),null,2)}catch(e){document.querySelector('#result').textContent=e.message+'；409请重新读取，网络失败请先检查列表确认结果，勿重复创建。'}}
document.querySelector('#identity').onchange=()=>{const p=profiles.find(x=>x.id===document.querySelector('#identity').value);document.querySelector('#model').value=p?.modelName||'';document.querySelector('#provider').value=p?.modelProvider||'';document.querySelector('#person').disabled=p?.kind!=='agent'};
document.querySelector('#load').onclick=()=>run(async()=>{const h=await api('/api/health'),list=await api('/api/issues'),ids=await api('/api/identities');profiles=ids.items;revision=ids.revision;for(const [id,rows] of [['identity',profiles],['person',profiles.filter(x=>x.kind==='person')]]){const el=document.getElementById(id);el.replaceChildren(new Option('未指定',''));for(const p of rows)el.add(new Option(p.name,p.id))}document.querySelector('#identity').onchange();return {health:h,...list,identities:profiles}});
document.querySelector('#create').onclick=()=>run(async()=>{if(created)throw Error('本页已创建演示问题，请刷新后再创建');if(!pendingCreate){const s=await api('/api/workspace'),p=profiles.find(x=>x.id===document.querySelector('#identity').value);pendingCreate={title:'HTML 合成演示问题',description:'仅用于接口演示',request_id:crypto.randomUUID(),expected_version:s.revision,actor:'HTML示例',creation:p?{identityId:p.id,initiatedByPersonId:p.kind==='agent'?document.querySelector('#person').value||null:null,modelInfo:p.kind==='agent'?{name:document.querySelector('#model').value,provider:document.querySelector('#provider').value}:null}:null}}let r;try{r=await api('/api/issues','POST',pendingCreate)}catch(e){if(/^(4\d\d) /.test(e.message))pendingCreate=null;throw e}pendingCreate=null;created=r.resource.id;revision=r.revision;document.querySelector('#verify').disabled=false;return r.resource});
document.querySelector('#verify').onclick=()=>run(async()=>{const e=document.querySelector('#evidence').value.trim();if(!e)throw Error('请填写观察依据');const r=await api('/api/issues/'+created+'/transitions','POST',{action:'verify',successCriteria:'示例能创建并回读',treatment:e,verificationMethod:'页面与API回读',request_id:crypto.randomUUID(),expected_version:revision,actor:'HTML示例'});revision=r.revision;document.querySelector('#verify').disabled=true;return r.resource});
</script></html>
