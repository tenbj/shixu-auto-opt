ight:550}p{margin:0;color:var(--muted)}.primary{padding:11px 19px;background:var(--green);color:#fff;border-radius:8px;white-space:nowrap}.secondary{padding:8px 14px;border:1px solid var(--line);border-radius:7px;background:#fff}.subtle{font-size:12px;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.stat{padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.stat .label{font-size:12px;color:#7d886f}.stat .num{font-size:31px;font-weight:500;margin:8px 0 1px;line-height:1.4}.stat small{font-size:10px;color:#9aa18d}.stat.highlight{background:#eaf0e0}.workspace{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(275px,1fr);gap:23px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;padding:21px 23px 18px;gap:10px}.panelhead p{font-size:11px;margin-top:4px}.task{display:flex;gap:14px;padding:20px 23px;border-top:1px solid #edf0e5;align-items:flex-start}.check{border:1.5px solid #c2cfb5;width:20px;height:20px;flex-shrink:0;border-radius:5px;padding:0;line-height:18px;margin-top:3px}.done .check{background:#718a5e;color:#fff}.done h3{text-decoration:line-through;color:#8b9780}.taskbody{flex:1;min-width:0}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11px;color:#98a08e}.pill{font-size:10px;padding:2px 7px;border-radius:5px;background:#edf1e6;color:#7b8969;white-space:nowrap}.pill.high{background:#fbefdf;color:#b1814e}.pill.done{background:#e9f1e4;color:#6b8957}.late{color:#b8794e}.source{font-size:11px;color:#819075;text-align:left;padding:0}.source:hover{text-decoration:underline}.nextbtn{font-size:11px;color:#58764d;padding:0}.issue{padding:17px 23px;border-top:1px solid #eef0e6}.issue-title{text-align:left;font-size:13px;font-weight:550;padding:0}.issue-title:hover{color:#73935f}.issue-foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.progress{width:74px;height:3px;border-radius:3px;background:#eef1e5;overflow:hidden}.progress i{display:block;height:100%;background:#95a77c}.note{margin-top:19px;padding:23px;border-radius:12px;background:#edf1e3}.note p{font-size:12px;line-height:1.9;color:#7b876e;margin:9px 0 18px}.note .quote{font:35px/1 Georgia;color:#99a781}.note small{font-size:10px;letter-spacing:1.5px;color:#9aa589}.section-footer{margin-top:24px;display:flex;gap:18px;flex-wrap:wrap;color:#9aa18e;font-size:11px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}input,select,textarea{border:1px solid #dfe5d6;border-radius:7px;padding:10px 12px;color:var(--ink);background:#fff;max-width:100%}.toolbar input{flex:1;min-width:180px}.list-issue{display:grid;grid-template-columns:1fr auto;gap:15px;padding:23px;border-bottom:1px solid var(--line)}.list-issue p{font-size:12px;margin-top:6px}.empty{padding:38px 23px;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:#647951;font-size:16px;margin-bottom:8px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.column{padding:15px;border-radius:12px;background:#ecf0e5;min-height:350px}.column h2{font-size:13px;padding:5px 3px 15px}.column .task{background:white;border:1px solid var(--line);border-radius:9px;padding:17px 13px;margin-bottom:12px;gap:10px}.column h3{font-size:13px}.banner{background:#fff1dc;color:#9b773f;padding:12px 20px;border-radius:8px;margin-bottom:20px}dialog{padding:0;border:1px solid var(--line);border-radius:15px;width:580px;max-width:calc(100vw - 26px);max-height:90vh;color:var(--ink);box-shadow:0 25px 90px #233c3326}dialog::backdrop{background:#293b2860;backdrop-filter:blur(3px)}.modal-head{padding:23px 26px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-body{padding:24px 26px}.modal-body p{font-size:13px}.field{display:grid;gap:6px;margin-bottom:17px;font-size:12px}.field input,.field select,.field textarea{width:100%}textarea{min-height:88px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:23px}.detail-desc{white-space:pre-wrap;background:#f6f8f0;padding:15px;border-radius:8px;margin:16px 0!important}.activity{border-left:2px solid #dce5cf;padding-left:10px;font-size:11px;color:#8a967b;margin:10px 0}.error{font-size:12px;color:#b66c48;min-height:20px}.toast{position:fixed;bottom:28px;left:calc(50% + 70px);transform:translateX(-50%);background:#38523d;color:#fff;padding:12px 23px;border-radius:9px;font-size:13px;z-index:30}.hidden{display:none!important}.tip{font-size:11px!important;margin-top:15px!important}.prototype-note{font-size:10px;color:#98a18e;margin-top:25px}

</style></head><body><aside><div class="brand"><div class="logo">⌁</div><div><b>拾序</b><small>A LITTLE MORE CLARITY</small></div></div><div class="nav-label">我的空间 / PERSONAL</div><nav id="nav"></nav><div class="sidebar-bottom"><b>让每个困扰，都有下一步。</b><p style="font-size:11px;margin-top:10px">个人工作台 · 本地体验版<br>数据仅保存在当前浏览器</p></div></aside><main><div class="topbar"><span>我的空间 <span style="margin:0 12px;color:#bcc6b2">/</span><span id="breadcrumb">今日概览</span></span><div class="topbar-right"><button data-event-id="EVT-ACTION" data-action="export" class="subtle">↓ 导出记录</button><span class="avatar">我</span></div></div><div id="storage-warning" class="banner hidden" role="alert"></div><div id="app" aria-live="polite">正在整理你的工作台…</div><div class="prototype-note">交互原型 · 初始内容为演示数据，可自由编辑。</div></main><dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button data-event-id="EVT-ACTION" data-action="close" aria-label="关闭弹窗">✕</button></div><div id="modal-content" class="modal-body"></div></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const KEY='shixu-personal-v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=d=>{const x=new Date();x.setDate(x.getDate()+d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},today=date(0),uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
const seed={version:1,issues:[{id:'p1',title:'每天整理报表，都在重复复制粘贴',description:'每个工作日要在三个表格之间搬数据，大约花掉40分钟。希望先找出最重复的步骤，尝试把它自动化。',priority:'高',tag:'工作效率',status:'处理中',resolution:'',logs:['记录问题：重复操作影响了专注时间。']},{id:'p2',title:'临时想法散落各处，回头总找不到',description:'微信收藏、便签和笔记里都有想法，需要的时候记不起放在哪里。',priority:'中',tag:'个人管理',status:'处理中',resolution:'',logs:['记录问题：需要统一的收集入口。']},{id:'p3',title:'会议结束后，下一步经常不够明确',description:'记了很多讨论内容，但没有把决定转成具体行动。',priority:'中',tag:'工作效率',status:'处理中',resolution:'',logs:['记录问题：尝试在会议结束前列出下一步。']},{id:'p4',title:'早上总花很久决定先做什么',description:'每天提前挑出三件值得推进的事。',priority:'低',tag:'个人管理',status:'已解决',resolution:'连续一周在前一天写好优先事项，第二天可以直接开始。',logs:['验证完成：提前规划减少了早晨的决策时间。']},{id:'p5',title:'收藏了很多文章，却很少真正用上',description:'试着把阅读收获变成一个可以尝试的小行动。',priority:'低',tag:'学习成长',status:'待梳理',resolution:'',logs:['记录问题：从输入到行动之间缺少一步。']}],tasks:[{id:'t1',title:'列出报表整理中最耗时的三个步骤',issueId:'p1',due:today,status:'进行中'},{id:'t2',title:'把散落的想法统一收集到一个清单',issueId:'p2',due:today,status:'待办'},{id:'t3',title:'整理上次会议的三条行动项',issueId:'p3',due:date(-1),status:'待办'},{id:'t4',title:'读完收藏文章，记下一个可用的方法',issueId:null,due:date(1),status:'待办'},{id:'t5',title:'连续一周提前写好第二天的重点',issueId:'p4',due:date(-1),status:'已完成'}]};
let db,view='today',query='',priority='全部',scope='未解决';
try{const saved=localStorage.getItem(KEY);db=saved?JSON.parse(saved):structuredClone(seed);if(db.version!==1||!Array.isArray(db.issues)||!Array.isArray(db.tasks))throw Error('format')}catch(e){db=structuredClone(seed);$('#storage-warning').textContent='无法读取原有本地记录，当前展示临时示例。原始记录未覆盖，请先检查浏览器存储。';$('#storage-warning').classList.remove('hidden')}
let storageBlocked=!$('#storage-warning').classList.contains('hidden');
const btn=(text,action,id='',cls='secondary')=>`<button class="${cls}" data-event-id="EVT-ACTION" data-action="${action}" data-id="${esc(id)}">${text}</button>`;
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function save(){try{if(storageBlocked)throw Error();localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){$('#storage-warning').textContent='当前修改尚未保存到浏览器。请使用“导出记录”保留数据，关闭页面前不要清除浏览器数据。';$('#storage-warning').classList.remove('hidden');return false}}
function changed(message){const ok=save();render();toast(ok?message:message+'（未持久保存，请导出）')}
const issue=id=>db.issues.find(x=>x.id===id),linked=id=>db.tasks.filter(t=>t.issueId===id),pending=()=>db.tasks.filter(t=>t.status!=='已完成'),active=()=>db.issues.filter(p=>p.status!=='已解决');
const dueLabel=t=>!t.due?'未设日期':t.due===today?'今天':t.due<today?'已逾期 · '+t.due.slice(5):t.due.slice(5);
function taskHTML(t){return `<div class="task ${t.status==='已完成'?'done':''}"><button data-event-id="EVT-ACTION" data-action="toggle" data-id="${esc(t.id)}" class="check" aria-label="${t.status==='已完成'?'重新打开':'完成'}：${esc(t.title)}">${t.status==='已完成'?'✓':''}</button><div class="taskbody"><h3>${esc(t.title)}</h3><div class="meta"><span class="${t.due&&t.due<today&&t.status!=='已完成'?'late':''}">${dueLabel(t)}</span><span>·</span>${t.issueId?btn('↗ '+esc(issue(t.issueId)?.title),'detail',t.issueId,'source'):'<span>独立待办</span>'}</div><div class="meta"><span class="pill">${t.status}</span>${t.status!=='已完成'?btn(t.status==='待办'?'开始行动 →':'退回待办','advance',t.id,'nextbtn'):''}${btn('编辑','edit-task',t.id,'nextbtn')}</div></div></div>`}
function empty(title,sub){return `<div class="empty"><strong>${title}</strong>${sub}</div>`}
function issueMini(p){const ts=linked(p.id),n=ts.filter(t=>t.status==='已完成').length;return `<div class="issue">${btn(esc(p.title),'detail',p.id,'issue-title')}<div class="meta"><span class="pill ${p.priority==='高'?'high':''}">${p.priority}优先级</span><span>${esc(p.tag)}</span></div><div class="issue-foot"><small style="font-size:10px;color:var(--muted)">${ts.length?n+' / '+ts.length+' 项行动完成':'尚未拆解行动'}</small><div class="progress"><i style="width:${ts.length?n/ts.length*100:0}%"></i></div></div></div>`}
function render(){const labels={today:'今日概览',issues:'问题池',tasks:'行动看板',review:'复盘记录'},icons={today:'◷',issues:'▧',tasks:'☷',review:'↺'};$('#breadcrumb').textContent=labels[view];$('#nav').innerHTML=Object.keys(labels).map(k=>btn(icons[k]+'　'+labels[k]+`<span>${k==='issues'?active().length:k==='tasks'?pending().length:''}</span>`,'nav',k,'nav '+(view===k?'active':''))).join('');
const head=(title,sub)=>`<div class="pagehead"><div><div class="eyebrow">${view==='today'?new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}):'拾序 / '+labels[view]}</div><h1>${title}</h1><p>${sub}</p></div>${btn('＋ 随手记','new','','primary')}</div>`;
if(view==='today'){const ts=pending().filter(t=>t.due&&t.due<=today).sort((a,b)=>a.due.localeCompare(b.due));$('#app').innerHTML=head('把困扰理清，把今天过好。','留一点空间给思考，也为重要的事迈出一小步。')+`<div class="stats">${[['待梳理的问题',active().filter(p=>p.status==='待梳理').length,'从一句话开始','issues'],['今天要推进',ts.length,'含逾期事项','tasks'],['正在行动',pending().filter(t=>t.status==='进行中').length,'一步一步来','tasks'],['已解决的问题',db.issues.filter(p=>p.status==='已解决').length,'每一次改善都算数','review']].map((s,i)=>btn(`<div class="label">${s[0]} ↗</div><div class="num">${String(s[1]).padStart(2,'0')}</div><small>${s[2]}</small>`,'nav',s[3],'stat '+(i===1?'highlight':''))).join('')}</div><div class="workspace"><div><div class="panel"><div class="panelhead"><div><h2>今天，先做这些 <span class="pill">${ts.length}</span></h2><p>从最小的行动开始，完成一项就划掉一项。</p></div>${btn('＋ 添加','new-task','','subtle')}</div>${ts.length?ts.map(taskHTML).join(''):empty('今天的清单很轻盈','可以添加一项行动，或给自己留点空白。')}</div><div class="section-footer"><span>○ 问题值得被看见，行动可以很小。</span>${btn('查看全部行动 →','nav','tasks','subtle')}</div></div><div class="rightcol"><div class="panel"><div class="panelhead"><h2>值得关注的问题</h2>${btn('全部 →','nav','issues','subtle')}</div>${active().slice().sort((a,b)=>['高','中','低'].indexOf(a.priority)-['高','中','低'].indexOf(b.priority)).slice(0,3).map(issueMini).join('')||empty('暂时没有困扰','新的问题可以随时记下来。')}</div><div class="note"><div class="quote">“</div><h3>做完一件事，不等于解决一个问题。</h3><p>行动完成后，再问一句：原来的困扰，真的变少了吗？把答案留在复盘里。</p>${btn('去看看已解决的问题 →','nav','review','subtle')}<div style="margin-top:20px"><small>SMALL STEPS. REAL CHANGE.</small></div></div></div></div>`}
else if(view==='issues'){const rows=db.issues.filter(p=>(scope==='全部'||(scope==='未解决'?p.status!=='已解决':p.status==='已解决'))&&(priority==='全部'||p.priority===priority)&&[p.title,p.description,p.tag].join(' ').toLowerCase().includes(query.toLowerCase()));$('#app').innerHTML=head('让问题有处安放。','先记录真实困扰，再决定哪些值得行动。')+`<div class="toolbar"><input id="search" data-event-id="EVT-FILTER" value="${esc(query)}" placeholder="搜索问题、描述或分类…" aria-label="搜索问题"><select id="priority" data-event-id="EVT-FILTER" aria-label="优先级">${['全部','高','中','低'].map(x=>`<option ${priority===x?'selected':''}>${x}</option>`).join('')}</select><select id="scope" data-event-id="EVT-FILTER" aria-label="问题状态">${['未解决','已解决','全部'].map(x=>`<option ${scope===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="panel">${rows.length?rows.map(p=>`<div class="list-issue"><div>${btn(esc(p.title),'detail',p.id,'issue-title')}<p>${esc(p.description||'还没有补充描述')}</p><div class="meta"><span class="pill ${p.priority==='高'?'high':''}">${p.priority}优先级</span><span>${esc(p.tag)}</span><span>${p.status}</span><span>${linked(p.id).length} 项关联行动</span></div></div>${btn('查看 →','detail',p.id,'subtle')}</div>`).join(''):empty('这里还没有匹配的问题','换个关键词或筛选条件，也可以记录一个新问题。')}</div>`}
else if(view==='tasks')$('#app').innerHTML=head('把下一步，变得具体。','每项行动都足够小，小到可以现在开始。')+`<div class="board">${['待办','进行中','已完成'].map(s=>{const ts=db.tasks.filter(t=>t.status===s);return `<section class="column"><h2>${s==='进行中'?'◐':s==='已完成'?'✓':'○'}　${s} <span class="pill">${ts.length}</span></h2>${ts.map(taskHTML).join('')||empty('暂时没有事项','为下一步留出空间')}${s==='待办'?btn('＋ 添加行动','new-task','','subtle'):''}</section>`}).join('')}</div>`;
else $('#app').innerHTML=head('看见那些真正的改变。','完成待办后，验证效果。让经验成为下一次行动的起点。')+`<div class="panel">${db.issues.filter(p=>p.status==='已解决').map(p=>`<div class="list-issue"><div><span class="pill done">已验证解决</span><h3 style="margin-top:10px">${esc(p.title)}</h3><p>${esc(p.resolution)}</p></div>${btn('查看复盘 →','detail',p.id,'subtle')}</div>`).join('')||empty('第一份改善记录，还在路上','从一个小问题开始，解决后在这里留下验证结论。')}</div>`}
function show(title,body){$('#modal-title').textContent=title;$('#modal-content').innerHTML=body;if(!$('#modal').open)$('#modal').showModal()}
function detail(id){const p=issue(id);if(!p)return;const ts=linked(id);show('问题详情',`<div class="meta"><span class="pill ${p.priority==='高'?'high':''}">${p.priority}优先级</span><span>${esc(p.tag)}</span><span>${p.status}</span></div><h2 style="margin-top:15px">${esc(p.title)}</h2><p class="detail-desc">${esc(p.description||'暂未补充描述')}</p><div class="panelhead" style="padding:8px 0"><h3>关联行动 · ${ts.filter(t=>t.status==='已完成').length}/${ts.length}</h3>${p.status!=='已解决'?btn('＋ 拆解行动','new-linked',id,'subtle'):''}</div>${ts.map(taskHTML).join('')||'<p class="tip">还没有行动。试着写下一个今天就能开始的步骤。</p>'}<h3 style="margin:22px 0 12px">处理记录</h3>${p.logs.map(l=>`<div class="activity">${esc(l)}</div>`).join('')}${p.resolution?`<p class="detail-desc">${p.status==='已解决'?'验证结论':'上次验证结论'}：${esc(p.resolution)}</p>`:''}<div class="modal-actions">${btn('编辑问题','edit-issue',id)}${btn(p.status==='已解决'?'重新打开':'验证并解决',p.status==='已解决'?'reopen':'resolve',id,'primary')}</div>`)}
const field=(label,html)=>`<label class="field">${label}${html}</label>`;
function edit(kind,id=null,source=null){const obj=id?(kind==='issue'?issue(id):db.tasks.find(t=>t.id===id)):null;show(obj?'编辑'+(kind==='issue'?'问题':'行动'):source?'拆解下一步行动':'随手记',`<form id="record-form" data-event-id="EVT-SUBMIT" data-kind="${kind}" data-id="${esc(id||'')}">${!id&&!source?field('记录类型',`<select id="kind" data-event-id="EVT-KIND"><option value="issue" ${kind==='issue'?'selected':''}>问题 / 痛点</option><option value="task" ${kind==='task'?'selected':''}>待办 / 行动</option></select>`):''}${field(kind==='issue'?'什么事情让你困扰？':'下一步具体做什么？',`<input data-event-id="EVT-FIELD" name="title" required maxlength="160" placeholder="用一句话记下来…" value="${esc(obj?.title||'')}">`)}${kind==='issue'?field('补充背景 · 选填',`<textarea data-event-id="EVT-FIELD" name="description" maxlength="5000" placeholder="什么时候发生？带来了什么影响？">${esc(obj?.description||'')}</textarea>`)+`<div class="grid2">${field('优先级',`<select data-event-id="EVT-FIELD" name="priority">${['中','高','低'].map(x=>`<option ${obj?.priority===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('分类 · 选填',`<input data-event-id="EVT-FIELD" name="tag" maxlength="40" placeholder="例如：工作效率" value="${esc(obj?.tag||'')}">`)}</div>`:field('计划完成日期 · 选填',`<input data-event-id="EVT-FIELD" type="date" name="due" value="${esc(obj?obj.due:today)}">`)+field('关联问题 · 可独立创建',`<select data-event-id="EVT-FIELD" name="issueId">${!source?'<option value="">独立待办</option>':''}${db.issues.filter(p=>(p.status!=='已解决'||obj?.issueId===p.id)&&(!source||p.id===source)).map(p=>`<option value="${esc(p.id)}" ${(source||obj?.issueId)===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select>`)}<div id="form-error" class="error" role="alert"></div><div class="modal-actions">${btn('取消','close')}<button type="submit" class="primary" data-event-id="EVT-SUBMIT">保存记录</button></div></form>`)}
function log(p,s){if(p)p.logs.push(new Date().toLocaleString('zh-CN')+' · '+s)}
function syncIssue(id){const p=issue(id);if(!p||p.status==='已解决')return;p.status=linked(id).length?'处理中':'待梳理'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-event-id="EVT-ACTION"]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='nav'){view=id;render()}else if(a==='new')edit('issue');else if(a==='new-task')edit('task');else if(a==='close')$('#modal').close();else if(a==='detail')detail(id);else if(a==='new-linked')edit('task',null,id);else if(a==='edit-task')edit('task',id);else if(a==='edit-issue')edit('issue',id);
else if(a==='toggle'||a==='advance'){const t=db.tasks.find(t=>t.id===id),p=issue(t.issueId);t.status=a==='toggle'?(t.status==='已完成'?'待办':'已完成'):(t.status==='待办'?'进行中':'待办');if(p?.status==='已解决'&&t.status!=='已完成'){p.status='处理中';log(p,'关联行动重新打开，问题需再次验证。')}log(p,`行动“${t.title}”更新为${t.status}`);changed('行动状态已更新');if($('#modal').open)detail(t.issueId)}
else if(a==='reopen'){const p=issue(id);p.status=linked(id).length?'处理中':'待梳理';log(p,'重新打开问题，保留上次验证结论供参考。');changed('问题已重新打开');detail(id)}
else if(a==='resolve'){if(linked(id).some(t=>t.status!=='已完成')){toast('还有未完成的行动，先完成后再验证效果。');return}show('验证这次改善',`<form id="resolve-form" data-event-id="EVT-SUBMIT" data-id="${esc(id)}"><p style="margin-bottom:18px">${esc(issue(id).title)}</p>${field('原来的困扰是否变少？请写下验证依据',`<textarea data-event-id="EVT-FIELD" name="resolution" required maxlength="5000" placeholder="例如：连续一周观察，报表整理从40分钟缩短至10分钟。"></textarea>`)}<div id="form-error" class="error" role="alert"></div><div class="modal-actions">${btn('暂不解决','detail',id)}<button type="submit" class="primary" data-event-id="EVT-SUBMIT">确认已解决</button></div></form>`)}
else if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='拾序记录-'+today+'.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前全部问题与行动记录')}});
document.addEventListener('input',e=>{if(e.target.dataset.eventId==='EVT-FILTER'&&e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.dataset.eventId==='EVT-FILTER'){if(e.target.id==='priority')priority=e.target.value;if(e.target.id==='scope')scope=e.target.value;render()}else if(e.target.dataset.eventId==='EVT-KIND'){const title=$('[name="title"]').value;edit(e.target.value);$('[name="title"]').value=title}});
document.addEventListener('submit',e=>{if(e.target.dataset.eventId!=='EVT-SUBMIT')return;e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),id=f.dataset.id;if(f.id==='resolve-form'){if(!v.resolution.trim()){$('#form-error').textContent='请填写验证结论。';return}if(linked(id).some(t=>t.status!=='已完成'))return;const p=issue(id);p.status='已解决';p.resolution=v.resolution.trim();log(p,'验证完成：'+p.resolution);$('#modal').close();changed('改善已记下，做得不错。');return}if(!v.title.trim()){$('#form-error').textContent='请用一句话描述，不能只输入空格。';return}v.title=v.title.trim();if(f.dataset.kind==='issue'){if(id){const p=issue(id);Object.assign(p,v);log(p,'更新问题内容。')}else db.issues.unshift({id:uid(),...v,tag:v.tag||'未分类',status:'待梳理',resolution:'',logs:['记录问题：'+new Date().toLocaleString('zh-CN')]})}else{v.issueId=v.issueId||null;if(id){const t=db.tasks.find(t=>t.id===id),old=t.issueId;Object.assign(t,v);syncIssue(old);syncIssue(t.issueId);log(issue(t.issueId),'更新行动：'+t.title)}else{db.tasks.unshift({id:uid(),...v,status:'待办'});syncIssue(v.issueId);log(issue(v.issueId),'新增行动：'+v.title)}}$('#modal').close();changed('记录已保存')});document.addEventListener('input',e=>{if(e.target.dataset.eventId==='EVT-FIELD'&&$('#form-error'))$('#form-error').textContent=''});render();
</script></body></html>
