ace-between;align-items:center;margin-top:11px}.progress{width:74px;height:3px;border-radius:3px;background:#eef1e5;overflow:hidden}.progress i{display:block;height:100%;background:#95a77c}.note{margin-top:19px;padding:23px;border-radius:12px;background:#edf1e3}.note p{font-size:12px;line-height:1.9;color:#7b876e;margin:9px 0 18px}.note .quote{font:35px/1 Georgia;color:#99a781}.note small{font-size:10px;letter-spacing:1.5px;color:#9aa589}.section-footer{margin-top:24px;display:flex;gap:18px;flex-wrap:wrap;color:#9aa18e;font-size:11px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}input,select,textarea{border:1px solid #dfe5d6;border-radius:7px;padding:10px 12px;color:var(--ink);background:#fff;max-width:100%}.toolbar input{flex:1;min-width:180px}.list-issue{display:grid;grid-template-columns:1fr auto;gap:15px;padding:23px;border-bottom:1px solid var(--line)}.list-issue p{font-size:12px;margin-top:6px}.empty{padding:38px 23px;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:#647951;font-size:16px;margin-bottom:8px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.column{padding:15px;border-radius:12px;background:#ecf0e5;min-height:350px}.column h2{font-size:13px;padding:5px 3px 15px}.column .task{background:white;border:1px solid var(--line);border-radius:9px;padding:17px 13px;margin-bottom:12px;gap:10px}.column h3{font-size:13px}.banner{background:#fff1dc;color:#9b773f;padding:12px 20px;border-radius:8px;margin-bottom:20px}dialog{padding:0;border:1px solid var(--line);border-radius:15px;width:580px;max-width:calc(100vw - 26px);max-height:90vh;color:var(--ink);box-shadow:0 25px 90px #233c3326}dialog::backdrop{background:#293b2860;backdrop-filter:blur(3px)}.modal-head{padding:23px 26px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-body{padding:24px 26px}.modal-body p{font-size:13px}.field{display:grid;gap:6px;margin-bottom:17px;font-size:12px}.field </style></head><body><aside><div class="brand"><div class="logo">⌁</div><div><b>拾序</b><small>A LITTLE MORE CLARITY</small></div></div><div class="nav-label">我的空间 / PERSONAL</div><nav id="nav"></nav><div class="sidebar-bottom"><b>让每个困扰，都有下一步。</b><p style="font-size:11px;margin-top:10px">个人工作台 · 本地体验版<br>数据仅保存在当前浏览器</p></div></aside><main><div class="topbar"><span>我的空间 <span style="margin:0 12px;color:#bcc6b2">/</span><span id="breadcrumb">今日概览</span></span><div class="topbar-right"><button data-event-id="EVT-ACTION" data-action="export" class="subtle">↓ 导出记录</button><span class="avatar">我</span></div></div><div id="storage-warning" class="banner hidden" role="alert"></div><div id="app" aria-live="polite">正在整理你的工作台…</div><div class="prototype-note">交互原型 · 初始内容为演示数据，可自由编辑。</div></main><dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button data-event-id="EVT-ACTION" data-action="close" aria-label="关闭弹窗">✕</button></div><div id="modal-content" class="modal-body"></div></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const KEY='shixu-personal-v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=d=>{const x=new Date();x.setDate(x.getDate()+d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},today=date(0),uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
const seed={version:1,issues:[{id:'p1',title:'每天整理报表，都在重复复制粘贴',description:'每个工作日要在三个表格之间搬数据，大约花掉40分钟。希望先找出最重复的步骤，尝试把它自动化。',priority:'高',tag:'工作效率',status:'处理中',resolution:'',logs:['记录问题：重复操作影响了专注时间。']},{id:'p2',title:'临时想法散落各处，回头总找不到',description:'微信收藏、便签和笔记里都有想法，需要的时候记不起放在哪里。',priority:'中',tag:'个人管理',status:'待处理',nextStep:'统一收集散落想法',successCriteria:'需要时能在一个入口找到',resolution:'',logs:['已梳理：统一收集入口。']},{id:'p3',title:'会议结束后，下一步经常不够明确',description:'记了很多讨论内容，但没有把决定转成具体行动。',priority:'中',tag:'工作效率',status:'处理中',resolution:'',logs:['记录问题：尝试在会议结束前列出下一步。']},{id:'p4',title:'早上总花很久决定先做什么',description:'每天提前挑出三件值得推进的事。',priority:'低',tag:'个人管理',status:'已解决',resolution:'连续一周在前一天写好优先事项，第二天可以直接开始。',logs:['验证完成：提前规划减少了早晨的决策时间。']},{id:'p5',title:'收藏了很多文章，却很少真正用上',description:'试着把阅读收获变成一个可以尝试的小行动。',priority:'低',tag:'学习成长',status:'待梳理',resolution:'',logs:['记录问题：从输入到行动之间缺少一步。']}],tasks:[{id:'t1',title:'列出报表整理中最耗时的三个步骤',issueId:'p1',due:today,status:'进行中'},{id:'t2',title:'把散落的想法统一收集到一个清单',issueId:'p2',due:today,status:'待办'},{id:'t3',title:'整理上次会议的三条行动项',issueId:'p3',due:date(-1),status:'待办'},{id:'t4',title:'读完收藏文章，记下一个可用的方法',issueId:null,due:date(1),status:'待办'},{id:'t5',title:'连续一周提前写好第二天的重点',issueId:'p4',due:date(-1),status:'已完成'}]};
const ISSUE_STATES=['待梳理','待处理','处理中','待验证','已解决','已暂缓','已关闭'],OPEN_STATES=ISSUE_STATES.slice(0,4);
let db,view='today',query='',priority='全部',scope='未解决';
try{const saved=localStorage.getItem(KEY);db=normalizeData(saved?JSON.parse(saved):structuredClone(seed))}catch(e){db=normalizeData(structuredClone(seed));$('#storage-warning').textContent='无法读取原有本地记录，当前展示临时示例。原始记录未覆盖，请先检查浏览器存储。';$('#storage-warning').classList.remove('hidden')}
let storageBlocked=!$('#storage-warning').classList.contains('hidden');
const btn=(text,action,id='',cls='secondary')=>`<button class="${cls}" data-event-id="EVT-ACTION" data-action="${action}" data-id="${esc(id)}">${text}</button>`;
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function save(){try{if(storageBlocked)throw Error();localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){$('#storage-warning').textContent='当前修改尚未保存到浏览器。请使用“导出记录”保留数据，关闭页面前不要清除浏览器数据。';$('#storage-warning').classList.remove('hidden');return false}}
function changed(message){const ok=save();render();toast(ok?message:message+'（未持久保存，请导出）')}
const issue=id=>db.issues.find(x=>x.id===id),linked=id=>db.tasks.filter(t=>t.issueId===id),pending=()=>db.tasks.filter(t=>!['已完成','已取消'].includes(t.status)),active=()=>db.issues.filter(p=>OPEN_STATES.includes(p.status));
const dueLabel=t=>!t.due?'未设日期':t.due===today?'今天':t.due<today?'已逾期 · '+t.due.slice(5):t.due.slice(5);
function empty(title,sub){return `<div class="empty"><strong>${title}</strong>${sub}</div>`}
function issueMini(p){const ts=linked(p.id),n=ts.filter(t=>t.status==='已完成').length;return `<div class="issue">${btn(esc(p.title),'detail',p.id,'issue-title')}<div class="meta"><span class="pill ${p.priority==='高'?'high':''}">${p.priority}优先级</span><span>${esc(p.tag)}</span>${stateBadge(p)}</div><div class="issue-foot"><small style="font-size:10px;color:var(--muted)">${ts.length?n+' / '+ts.length+' 项行动完成':'尚未拆解行动'}</small><div class="progress"><i style="width:${ts.length?n/ts.length*100:0}%"></i></div></div></div>`}
function render(){const labels={today:'今日概览',issues:'问题池',tasks:'行动看板',review:'复盘记录'},icons={today:'◷',issues:'▧',tasks:'☷',review:'↺'};$('#breadcrumb').textContent=labels[view];$('#nav').innerHTML=Object.keys(labels).map(k=>btn(icons[k]+'　'+labels[k]+`<span>${k==='issues'?active().length:k==='tasks'?pending().length:''}</span>`,'nav',k,'nav '+(view===k?'active':''))).join('');
const head=(title,sub)=>`<div class="pagehead"><div><div class="eyebrow">${view==='today'?new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}):'拾序 / '+labels[view]}</div><h1>${title}</h1><p>${sub}</p></div>${btn('＋ 随手记','new','','primary')}</div>`;
if(view==='today'){const ts=pending().filter(t=>t.due&&t.due<=today&&!['已暂缓','已关闭'].includes(issue(t.issueId)?.status)).sort((a,b)=>a.due.localeCompare(b.due));$('#app').innerHTML=head('把困扰理清，把今天过好。','留一点空间给思考，也为重要的事迈出一小步。')+`<div class="stats">${[['待梳理的问题',active().filter(p=>p.status==='待梳理').length,'从一句话开始','issues'],['今天要推进',ts.length,'含逾期事项','tasks'],['正在行动',pending().filter(t=>t.status==='进行中').length,'一步一步来','tasks'],['已解决的问题',db.issues.filter(p=>p.status==='已解决').length,'每一次改善都算数','review']].map((s,i)=>btn(`<div class="label">${s[0]} ↗</div><div class="num">${String(s[1]).padStart(2,'0')}</div><small>${s[2]}</small>`,'nav',s[3],'stat '+(i===1?'highlight':''))).join('')}</div>${db.issues.some(dueReview)?`<div class="review-reminder">${btn('↺ '+db.issues.filter(dueReview).length+' 个暂缓问题到了回看时间 →','status-filter','已暂缓','subtle')}</div>`:''}<div class="workspace"><div><div class="panel"><div class="panelhead"><div><h2>今天，先做这些 <span class="pill">${ts.length}</span></h2><p>从最小的行动开始，完成一项就划掉一项。</p></div>${btn('＋ 添加','new-task','','subtle')}</div>${ts.length?ts.map(taskHTML).join(''):empty('今天的清单很轻盈','可以添加一项行动，或给自己留点空白。')}</div><div class="section-footer"><span>○ 问题值得被看见，行动可以很小。</span>${btn('查看全部行动 →','nav','tasks','subtle')}</div></div><div class="rightcol"><div class="panel"><div class="panelhead"><h2>值得关注的问题</h2>${btn('全部 →','nav','issues','subtle')}</div>${active().slice().sort((a,b)=>['高','中','低'].indexOf(a.priority)-['高','中','低'].indexOf(b.priority)).slice(0,3).map(issueMini).join('')||empty('暂时没有困扰','新的问题可以随时记下来。')}</div><div class="note"><div class="quote">“</div><h3>做完一件事，不等于解决一个问题。</h3><p>行动完成后，再问一句：原来的困扰，真的变少了吗？把答案留在复盘里。</p>${btn('去看看已解决的问题 →','nav','review','subtle')}<div style="margin-top:20px"><small>SMALL STEPS. REAL CHANGE.</small></div></div></div></div>`}

  }else{
    const old=id?db.tasks.find(t=>t.id===id):null,newId=v.issueId||null,p=issue(newId),required=v.required!=='later';
    if(newId&&!p)return '关联问题不存在。';
    if(p&&['已暂缓','已关闭','已解决'].includes(p.status)&&(!old||old.issueId!==newId))return '请先恢复或重新打开目标问题，再新增行动。';
    if(old&&old.issueId!==newId&&p?.status==='待梳理'&&old.status==='进行中')return '请先梳理目标问题，或将行动退回待办再关联。';
    if(old&&old.issueId!==newId&&p?.status==='待处理'&&old.status==='进行中'){
      const error=transitionIssue(p,'start',{});if(error)return error;
    }
    if(p&&['已暂缓','已关闭'].includes(p.status)&&old?.required===false&&required)return '请先恢复问题，再把行动改为本轮必要。';
    const values={title:v.title,issueId:newId,due:v.due||'',required};
    if(old){const previous=issue(old.issueId);Object.assign(old,values);if(previous&&previous!==p)log(previous,'解除行动关联：'+old.title)}else db.tasks.unshift({id:uid(),...values,status:'待办',cancelReason:''});
    const task=old||db.tasks[0];
    if(p&&required&&!['已完成','已取消'].includes(task.status)&&['待验证','已解决'].includes(p.status))setState(p,'处理中','新增或重新指定必要行动，需要再次验证');
    log(p,(old?'更新':'新增')+'行动：'+v.title);
  }
  return '';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-event-id="EVT-ACTION"]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
  if(a==='nav'){view=id;render()}
  else if(a==='status-filter'){view='issues';scope=id;render()}
  else if(a==='new')edit('issue');else if(a==='new-task')edit('task');else if(a==='close')$('#modal').close();else if(a==='detail')detail(id);
  else if(a==='new-linked'){const p=issue(id);if(p&&OPEN_STATES.includes(p.status))edit('task',null,id);else toast('请先恢复或重新打开问题。')}
  else if(a==='edit-task')edit('task',id);else if(a==='edit-issue')edit('issue',id);
  else if(a==='toggle'||a==='advance'){const t=db.tasks.find(t=>t.id===id);if(t)changeTask(t,a)}
  else if(a==='cancel-task')cancelTaskForm(id);
  else if(['triage','start','verify','resolve','reject','pause','resume','close-issue','reopen','retriage'].includes(a))workflowForm(a,id);
  else if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='拾序记录-'+today+'.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前全部问题、行动与状态记录')}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.eventId==='EVT-FILTER'&&e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}
  if(e.target.dataset.eventId==='EVT-FIELD'&&$('#form-error'))$('#form-error').textContent='';
});
document.addEventListener('change',e=>{if(e.target.dataset.eventId==='EVT-FILTER'){if(e.target.id==='priority')priority=e.target.value;if(e.target.id==='scope')scope=e.target.value;render()}else if(e.target.dataset.eventId==='EVT-KIND'){const title=$('[name="title"]').value;edit(e.target.value);$('[name="title"]').value=title}});
document.addEventListener('submit',e=>{
  if(e.target.dataset.eventId!=='EVT-SUBMIT')return;e.preventDefault();
  const f=e.target,v=Object.fromEntries(new FormData(f)),id=f.dataset.id;let error='',returnId=null;
  if(f.id==='workflow-form'){const p=issue(id);error=p?transitionIssue(p,f.dataset.transition,v):'问题不存在';returnId=id}
  else if(f.id==='cancel-form'){const t=db.tasks.find(t=>t.id===id);if(!t)return;const p=issue(t.issueId);if(!v.reason.trim())error='请填写取消原因。';else if(p&&['已暂缓','已关闭'].includes(p.status))error='请先恢复或重新打开问题。';else{t.status='已取消';t.cancelReason=v.reason.trim();log(p,'取消行动：'+t.title+'；'+t.cancelReason);returnId=p?.id}}
  else error=submitRecord(f,v);
  if(error){$('#form-error').textContent=error;return}
  $('#modal').close();changed('已保存');if(returnId)detail(returnId);
});
render();

</script></body></html>
